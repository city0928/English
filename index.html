 return pageTop(esc(title),`第 ${quiz.index+1} / ${quiz.questions.length} 题 · ${quiz.mode==='placement'?'不查词完成；结果只用于定位阅读起点。':'先理解，再作答。'}`,btn('退出本轮','data-action="exitquiz"','ghost'))+`<div class="progress quiz-progress"><span style="width:${quiz.index/quiz.questions.length*100}%"></span></div><div style="max-width:860px;margin:auto">${q.type==='reading'?(q.material?materialHTML(q.material):labelHTML(l)):''}<div class="card question-card"><div class="row between wrap"><span class="badge">${({reading:'阅读理解',word:'词义理解',phrase:'表达选择',listen:'听句理解'})[q.type]}</span><span class="source-tag">${quiz.mode==='placement'?'区块 '+q.block:quiz.mode==='stage'?'新材料 · 不等同语言等级测试':esc(l?.title||'综合')}</span></div><h3>${esc(q.q)}</h3>${q.type==='listen'?`<div class="quiz-listening">${btn(`${ic('speaker')} 播放英文`,`data-say="${esc(q.spoken)}"`,'secondary')}<button class="text-link" data-action="revealtranscript">${quiz.revealed[q.id]?'已展开 · 本轮包含阅读辅助':'听不到或不理解？展开英文'}</button>${quiz.revealed[q.id]?`<div class="en" lang="en" style="font-size:18px">${esc(q.spoken)}</div>`:''}</div>`:''}<div class="options">${q.options.map((o,i)=>`<button class="option ${answered?(quiz.mode==='placement'?(i===a?'selected':'locked'):(i===q.answer?'correct':i===a?'wrong':'locked')):''}" data-action="quizanswer" data-option="${i}" ${answered?'disabled':''}><span class="option-letter">${'ABC'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>${answered?`${quiz.mode==='placement'?'<div class="note" style="margin-top:16px">已记录。自测结束后再查看解释，避免中途提示影响后续选择。</div>':`<div class="answer-note ${a===q.answer?'':'bad'}">${a===q.answer?'答对了。':'这题已记入错题。'}${esc(q.why)}</div>`}<div class="row" style="justify-content:flex-end;margin-top:20px">${btn(`${quiz.index===quiz.questions.length-1?'查看结果':'下一题'} ${ic('arrow')}`,'data-action="quiznext"')}</div>`:''}</div><p class="muted" style="font-size:11px;margin:16px 0">所有案例、价格、规定与路线为原创教学模拟。朗读为设备合成语音，不是新加坡真人口音录音。</p></div>`;
}
function finishQuiz(){quiz.finished=true;if(quiz.saved)return;const good=quiz.answers.filter((a,i)=>a===quiz.questions[i].answer).length,score=Math.round(good/quiz.questions.length*100),today=localDate(),assisted=Object.keys(quiz.revealed).length>0;
 if(['lesson','week','stage'].includes(quiz.mode)){const key={lesson:'scores',week:'weekly',stage:'stages'}[quiz.mode],old=state[key][quiz.id];state[key][quiz.id]={best:Math.max(old?.best||0,score),last:score,date:today,unassistedBest:Math.max(old?.unassistedBest||0,assisted?0:score),assisted};if(quiz.mode==='lesson'&&score>=80){state.completed[quiz.id]=state.completed[quiz.id]||today;addLessonReview(quiz.id,false);}}
 if(quiz.mode==='placement'){const blocks=[1,2,3].map(b=>quiz.questions.filter((q,i)=>q.block===b&&quiz.answers[i]===q.answer).length);const recommendation=blocks[0]<3?1:blocks[1]<3?2:blocks[2]<3?3:4;state.placement={blocks,score,date:today,recommendation};}
 quiz.saved=true;logActivity();save();
}
function quizResults(){const good=quiz.answers.filter((a,i)=>a===quiz.questions[i].answer).length,score=Math.round(good/quiz.questions.length*100),passed=score>=80,wrong=quiz.questions.filter((q,i)=>quiz.answers[i]!==q.answer),expanded=Object.keys(quiz.revealed).length;
 if(quiz.mode==='placement'){const p=state.placement;return `<div class="quiz-width"><section class="card quiz-result"><span class="eyebrow">STARTING POINT · NOT A LANGUAGE CERTIFICATE</span><h1 style="margin-top:16px">建议从阶段 ${p.recommendation} 开始核验</h1><div class="placement-stats">${['基础','短信息','条件长句'].map((x,i)=>`<div><strong>${p.blocks[i]} / 4</strong><span>${x}</span></div>`).join('')}</div><p>这是阅读起点建议，不能证明听说达标。即使读得懂，数字听不清或不能独立三轮问答，也建议前移补练。前面课程不会被标记为已完成。</p><div class="result-actions">${btn('从建议阶段开始',`data-action="focusstage" data-stage="${p.recommendation}"`)}${btn('从基础完整学习','data-action="focusstage" data-stage="1"','secondary')}${btn('查看所有阶段','data-nav="plan"','ghost')}</div></section>${errorResults(wrong)}</div>`;}
 let msg=quiz.mode==='lesson'?(passed?'本课理解小测过关，7 张词句卡已加入复习。开口与写作还需要独立练习，不因选择题通过就跳过。':'先回到课文补练，再试一次。至少答对 4/5 才记录本课理解过关。'):quiz.mode==='week'?'周测重用本周材料，帮助找出遗忘点；不能替代陌生材料或真实交流。':quiz.mode==='stage'?(passed?(expanded?'理解达到门槛，但包含文字辅助。请继续练听，再以未展开文字的方式复测。':'理解达到门槛；还要完成本阶段的独立任务清单，才能记为阶段验收达标。'):'这次找到薄弱点。先补练，再用相同技能处理新的材料。'):'答对的题已移出错题；没有掌握的可以回相关课程补练。';
 let next=quiz.mode==='lesson'?LESSONS[LESSONS.findIndex(l=>l.id===quiz.id)+1]:null;
 return `<div class="quiz-width"><section class="card quiz-result"><div class="score-circle"><strong>${score}<span style="font-size:18px">%</span></strong><small>${good}/${quiz.questions.length} 正确</small></div><h2>${passed?'理解练习有进展了。':'找到薄弱环节，继续补练。'}</h2><p>${msg}</p>${expanded?`<div class="note warm" style="text-align:left;margin-bottom:20px">${expanded} 道听句题展开过英文。本次是含文字辅助的理解成绩，不作为未展开文字的阶段验收记录。</div>`:''}<div class="result-actions">${btn('再练一次','data-action="retryquiz"','secondary')}${quiz.mode==='stage'?btn('完成独立任务自评',`data-nav="checkpoints/${quiz.id}"`):quiz.mode==='lesson'?btn('回到表达练习',`data-nav="lesson/${quiz.id}/practice"`,'ghost'):btn('返回学习路线','data-nav="plan"','ghost')}${next&&passed?btn('继续下一课',`data-nav="lesson/${next.id}/words"`):btn('去复习词句','data-nav="review"','ghost')}</div></section>${errorResults(wrong)}</div>`;
}

function maintainPage(){return pageTop('结业以后，继续把英语用起来。','四周循环，每周三项迁移任务；其他天用 10–15 分钟复习到期卡。这里不再安排更多同样的选择题。')+`<div class="note" style="margin-bottom:20px">这是完整路径的保持阶段，不是新的入门阶段。课程合成语音不能覆盖真实语速和口音；请加入真人录音与真实同伴的追问。点击下方外部材料会联网，本地课程本身不需要联网。</div>${maintenanceTasks.map((w,i)=>`<section class="card checkpoint-card"><h2>${esc(w.title)}</h2><div class="skill-checks">${w.tasks.map((t,j)=>`<label><input type="checkbox" data-maintain="m${i+1}-${j+1}" ${state.maintenance[`m${i+1}-${j+1}`]?'checked':''}><span>${esc(t)}</span></label>`).join('')}</div></section>`).join('')}<div class="two-column"><section class="card"><h3>下一轮怎么开始</h3><p style="margin:12px 0">同样的任务结构，换不同商品、不同录音、不同问题。记录只表示你自评做过，不代表系统检测了实际表现。</p>${btn('清空本轮任务勾选','data-action="resetmaintain"','ghost')}${btn('导出完整进度','data-action="export"','secondary')}</section><section class="card"><h3>外部真人听力（需联网）</h3><p style="margin:12px 0">可从 British Council LearnEnglish 的生活听力材料开始；水平选择不作为本课程的等级认证。</p><a href="https://learnenglish.britishcouncil.org/skills/listening" target="_blank" rel="noopener noreferrer">打开 British Council 听力材料 ↗</a><p class="muted" style="font-size:12px;margin-top:10px">外部网站的可用性、页面路径与内容可能变化。</p></section></div>`;}
function settingsPage(){return pageTop('完整课程在本地，记录由你保管。','版本 2.0 · 120 实课 / 24 周测 / 6 阶段验收 / 起点自测 / 长期保持。')+`<div class="settings-grid"><section class="card"><h3>英文朗读</h3><p class="description">使用系统 / 浏览器的英文语音，没有内置真人录音。可用声音和离线播放能力取决于设备。</p><div class="setting-field"><label for="voice-select">选择声音</label><select id="voice-select" data-setting="voice"></select><small id="voice-status"></small></div><div class="setting-field"><label for="speech-rate">语速 <span id="rate-value">${state.settings.rate.toFixed(2)}×</span></label><input id="speech-rate" type="range" min="0.6" max="1.2" step="0.05" data-setting="rate" value="${state.settings.rate}"><small>先慢速理解，再逐步接近 1.0×。设备合成语音并不模拟真实新加坡口音。</small></div><div class="backup-actions">${btn('试听','data-say="Could you confirm the final time and price, please?"','secondary')}${btn('停止','data-action="stopspeech"','ghost')}</div></section>
 <section class="card"><h3>计划与起点</h3><p class="description">24 周只是参考编排。每课约 30–40 分钟，可拆分；每阶段可重复，已有基础也能跳读。</p><div class="setting-field"><label for="settings-start">计划开始日期</label><input id="settings-start" type="date" data-setting="start" value="${state.start}"></div><div class="setting-field"><label for="departure-date">出发日期（可留空）</label><input id="departure-date" type="date" data-setting="departure" value="${state.settings.departure}"></div><div class="note">当前学习关注点：阶段 ${state.focusStage}。${state.settings.departure?`出发日期：${esc(state.settings.departure)}。`:''}开始日期不会强制跳课、自动判断达标或清空旧记录。</div><div class="backup-actions">${btn('测起点','data-nav="placement"','secondary')}${btn('完整路线','data-nav="plan"','ghost')}</div></section>
 <section class="card"><h3>记录、导入与旧版兼容</h3><p class="description">理解过关 ${learned()} 课；开口自评 ${Object.keys(state.oral).length} 课；写作草稿 ${Object.keys(state.notes).filter(k=>state.notes[k].trim()).length} 份。</p><div class="backup-actions">${btn('导出学习记录','data-action="export"')}${btn('导入记录','data-action="import"','secondary')}</div><ul class="info-list"><li>未登录时仅保存在当前浏览器；登录后自动同步到账号，换设备请登录同一账号。</li><li>支持旧版六周课程导出的 JSON：保留原 30 课进度、收藏、错题和复习日期，并映射到新版所在周。</li><li>新文件地址可能看不到旧文件的本地记录。请先在旧版导出，再在这里导入，不保证自动发现。</li><li>导入会覆盖当前记录；操作前先导出当前备份。</li><li>无痕模式、清除浏览器数据、移动文件或更换访问地址可能导致记录不可见。建议使用固定本地地址并定期备份。</li><li>未结束的测验、组句步骤、专注计时不跨刷新保存；草稿和已完成记录会保存。</li></ul>${btn('清除本浏览器全部记录','data-action="resetrequest"','danger small')}</section>
 <section class="card"><h3>功能与能力边界</h3><ul class="info-list"><li>课程与同步脚本保存在本站，无外部字体或图片依赖。已加载的课程可离线使用；跨设备同步需要联网。</li><li>没有联网 AI 对话、语音识别、发音评分或自动写作语义评分。脚本对话用于角色扮演，开放任务由你或同伴检查。</li><li>全部商品、价格、日期、政策和路线都是原创教学模拟，不是新加坡实时规则，也不是法律、医疗或安全判断依据。</li><li>目标涵盖常见商品信息、服务沟通和熟悉话题交流；不包括所有英语、所有专业说明、快速口语或复杂辩论。</li><li>课程借鉴任务型能力描述，未进行正式教学成效验证，不保证 24 周达到某个等级；自测和阶段分数不是 CEFR 认证。</li></ul></section>
 <section class="card" style="grid-column:1/-1"><h3>参考与使用说明</h3><p class="description">原创课程按你的任务目标编排。能力范围和浏览器行为参考以下公开资料；课程不是官方机构教材。</p>${DATA.sources.map(s=>`<p class="source-line"><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)} ↗</a><small>${esc(s.note)}</small></p>`).join('')}<div class="note">电脑：下载 HTML，用浏览器打开。手机 / iPad 的文件预览可能不执行脚本，可通过同一 Wi-Fi 下的电脑本地服务访问。网页不调用云端 AI；使用非本地系统语音时，该语音服务可能需要网络。请勿对公网开放附带的简易本地服务。</div></section></div>`;}
// New actions coexist with the original delegated handlers.
document.addEventListener('click',e=>{const el=e.target.closest('button[data-action]');if(!el||el.disabled)return;const a=el.dataset.action,id=el.dataset.id;
 if(a==='focusstage'){const n=bounded(el.dataset.stage,1,6);state.focusStage=n;const l=LESSONS.find(x=>x.stage===n&&!state.completed[x.id])||LESSONS.find(x=>x.stage===n);state.lastLesson=l.id;save();go('lesson/'+l.id+'/words');}
 if(['buildword','undobuild','resetbuild','checkbuild','showbuild'].includes(a)){const l=LESSON_MAP[id];if(!l)return;const b=getBuild(l);if(a==='buildword'){const i=Number(el.dataset.index);if(b.pool[i]&&!b.chosen.includes(i))b.chosen.push(i);b.feedback='';b.ok=false;}if(a==='undobuild'){b.chosen.pop();b.feedback='';b.ok=false;}if(a==='resetbuild'){b.chosen=[];b.feedback='';b.ok=false;b.reference=false;}if(a==='showbuild')b.reference=true;if(a==='checkbuild'){b.ok=b.chosen.length===b.pool.length&&normalizeSentence(b.chosen.map(i=>b.pool[i].text).join(' '))===normalizeSentence(l.phrases[0].en);b.feedback=b.ok?'语序与参考句一致。现在把其中一个信息换成自己的，再说一遍。':'还没有拼成这条参考句。先找主语、动词与请求对象，或展开参考后重练。';if(b.ok)logActivity();}render(true);}
 if(a==='savenote'){const t=$('#lesson-note');if(t){state.notes[id]=t.value.slice(0,6000);save();$('#note-status').textContent=storageOK?'已保存本地草稿。':'本地保存不可用，请立即导出记录。';toast(storageOK?'草稿已保存。':'请导出记录以免丢失。');}}
 if(a==='resetmaintain')confirmModal('开始新一轮四周任务？','仅清除长期保持任务的勾选，不影响课程、测验、草稿和复习卡。',()=>{state.maintenance={};save();render(true);});
});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.note&&LESSON_MAP[t.dataset.note]){state.notes[t.dataset.note]=t.value.slice(0,6000);save();const s=$('#note-status');if(s)s.textContent=storageOK?'已自动保存到本浏览器。':'未能本地保存，请导出记录。';}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.skillStage){const sid=Number(t.dataset.skillStage),i=Number(t.dataset.skillIndex);if(!STAGES[sid-1]||i<0||i>=3)return;state.stageSkills[sid]??=[false,false,false];state.stageSkills[sid][i]=t.checked;logActivity();render(true);}if(t.dataset.maintain){if(t.checked)state.maintenance[t.dataset.maintain]=localDate();else delete state.maintenance[t.dataset.maintain];logActivity();}});

render();


window.EnglishSync.mount({
 snapshot:()=>JSON.parse(JSON.stringify(state)),
 setStorageKey:value=>{STORAGE_KEY=value;},
 apply:raw=>{state=normalise(raw);quiz=null;review=null;roleState=null;readAnswers={};save();render();},
 storageFailed:()=>{storageOK=false;storageWarning();},
 canApply:()=>route.page!=='lesson'&&!(quiz&&!quiz.finished)&&!review&&!document.querySelector('dialog[open]')&&!document.activeElement?.matches('input,textarea'),
 toast,export:exportProgress
});
