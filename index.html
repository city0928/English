 with my family.","zh":"我和家人一起来。"}],"label":{"kind":"原创模拟材料","brand":"EVERYDAY ENGLISH · PRACTICE ONLY","title":"MEET A VISITOR","subtitle":"打招呼与自我介绍","price":"READ & UNDERSTAND","lines":[["Name","Kai"],["Home","China"],["Travel group","Family"]],"foot":"Fictional learning material. Check real information when travelling."},"questions":[{"q":"Kai 来自哪里？","options":["新加坡","未说明","中国"],"answer":2,"why":"Home: China 表示来自中国。"},{"q":"谁和 Kai 一起来？","options":["家人","同事","独自一人"],"answer":0,"why":"Family 是家人。"}],"dialogue":[{"role":"staff","en":"Hello. Welcome!","zh":"你好，欢迎！"},{"role":"you","en":"Hello. My name is Kai.","zh":"你好，我叫 Kai。"},{"role":"staff","en":"Where are you from?","zh":"你来自哪里？"},{"role":"you","en":"I'm from China.","zh":"我来自中国。"},{"role":"staff","en":"Are you here with your family?","zh":"你和家人一起来的吗？"},{"role":"you","en":"Yes. We're here for a visit.","zh":"是的，我们来旅游。"}],"task":"用三句话介绍姓名、来自哪里、和谁出行。再问对方来自哪里。","tip":"先自己尝试，再查看参考；练习时替换其中的时间、数量或需求。","number":2},{"id":"f003","week":1,"day":3,"stage":1,"title":"听懂零到十与电话号码","goal":"逐位读出三个自编房间号。","words":[{"en":"zero","zh":"零","example":"Two, zero, five."},{"en":"number","zh":"号码；数字","example":"What is your room number?"},{"en":"phone","zh":"电话","example":"Phone extension: 409"},{"en":"repeat","zh":"重复","example":"Could you repeat the number?"},{"en":"digit","zh":"一位数字","example":"Digits in 409: Four, zero, nine"}],"phrases":[{"en":"Could you repeat the number?","zh":"请再说一遍号码。"},{"en":"Is that five or nine?","zh":"那个数字是五还是九？"}],"label":{"kind":"原创模拟材料","brand":"EVERYDAY ENGLISH · PRACTICE ONLY","title":"CONTACT NOTE","subtitle":"听懂零到十与电话号码","price":"READ & UNDERSTAND","lines":[["Room","205"],["Phone extension","409"],["Digits in 409","Four, zero, nine"]],"foot":"Fictional learning material. Check real information when travelling."},"questions":[{"q":"电话分机是多少？","options":["409","205","490"],"answer":0,"why":"Phone extension 是电话分机。"},{"q":"409 中间的数字是什么？","options":["five","zero","two"],"answer":1,"why":"Zero 表示 0。"}],"dialogue":[{"role":"staff","en":"What is your room number?","zh":"你的房间号是多少？"},{"role":"you","en":"Two, zero, five.","zh":"二、零、五。"},{"role":"staff","en":"Please call extension four, zero, nine.","zh":"请拨分机四、零、九。"},{"role":"you","en":"Could you repeat the number?","zh":"请再说一遍号码。"},{"role":"staff","en":"Four, zero, nine.","zh":"四、零、九。"},{"role":"you","en":"Thank you. Four, zero, nine.","zh":"谢谢，是四、零、九。"}],"task":"逐位读出三个自编房间号。听完 409 后复述；再把它改成 490。","tip":"号码中的 0 可能读 zero 或 oh。本课先学清楚 zero；电话号码通常逐位读。","number":3},{"id":"f004","week":1,"day":4,"stage":1,"title":"十三还是三十","goal":"分别说出 13/30、14/40、15/50、16/60。","words":[{"en":"thirteen","zh":"十三","example":"Is that thirteen or thirty?"},{"en":"thirty","zh":"三十","example":"The large box is thirty dollars."},{"en":"fifteen","zh":"十五","example":"At ten fifteen."},{"en":"fifty","zh":"五十","example":"The total is fifty dollars."},{"en":"total","zh":"总计","example":"The total is fifty dollars."}],"phrases":[{"en":"Is that thirteen or thirty?","zh":"是十三还是三十？"},{"en":"The total is fifty dollars.","zh":"总计五十元。"}],"label":{"kind":"原创模拟材料","brand":"EVERYDAY ENGLISH · PRACTICE ONLY","title":"PRICE CHECK","subtitle":"十三还是三十","price":"READ & UNDERSTAND","lines":[["Small box","$13"],["Large box","$30"],["Two large cups","$50 in total"]],"foot":"Fictional learning material. Check real information when travelling."},"questions":[{"q":"大盒的价格是多少？","options":["13 元","30 元","50 元"],"answer":1,"why":"Large box: $30。"},{"q":"两只大杯的总价是多少？","options":["15 元","30 元","50 元"],"answer":2,"why":"Total 指总价；fifty 是 50。"}],"dialogue":[{"role":"staff","en":"The large box is thirty dollars.","zh":"大盒三十元。"},{"role":"you","en":"Is that thirteen or thirty?","zh":"是十三还是三十？"},{"role":"staff","en":"Thirty. Three, zero.","zh":"三十，三、零。"},{"role":"you","en":"Thank you. I'll take the large box.","zh":"谢谢，我要大盒。"},{"role":"staff","en":"The small box is thirteen dollars.","zh":"小盒十三元。"},{"role":"you","en":"I understand. Thirteen for the small one.","zh":"明白了，小盒十三元。"}],"task":"分别说  travelling."},"questions":[{"q":"it can be machine-washed 中 it 指什么？","options":["外套","枕芯","收纳袋"],"answer":0,"why":"前一句主语 The cover，且 pillow 明确不能机洗。"},{"q":"That one costs five dollars more 指哪个？","options":["单独的外套","大号套装","收纳袋"],"answer":1,"why":"That one 替代紧接着提到的 larger set。"}],"dialogue":[{"role":"staff","en":"The cover is removable, and it can be machine-washed.","zh":"外套可拆，而且它可机洗。"},{"role":"you","en":"Do you mean the cover, not the pillow?","zh":"你说的是外套，不是枕芯，对吗？"},{"role":"staff","en":"That's right. The pillow must not be machine-washed.","zh":"对，枕芯不能机洗。"},{"role":"you","en":"What about the larger one?","zh":"那大号的呢？"},{"role":"staff","en":"That set costs five dollars more. Both include a storage bag.","zh":"那套贵五元，两套都含收纳袋。"},{"role":"you","en":"Are the care instructions the same for both?","zh":"两套的清洗要求相同吗？"},{"role":"staff","en":"Yes, the same instructions apply.","zh":"是的，相同。"},{"role":"you","en":"Thanks. I'll take the smaller set.","zh":"谢谢，我要小号套装。"}],"task":"将 it / one / both 替换成具体名词再读一遍；代词不清楚时主动确认。","tip":"先自己尝试，再查看参考；练习时替换其中的时间、数量或需求。","number":99},{"id":"f100","week":20,"day":5,"stage":5,"title":"完整协商：问题、方案与落实","goal":"独立完成至少四轮协商，覆盖问题、优先级、替代方案、确认与落实。","words":[{"en":"acceptable","zh":"可接受的","example":"Acceptable compromise: A smaller room if it is quieter"},{"en":"alternative","zh":"替代方案","example":"We're sorry about the noise. We can offer two alternatives."},{"en":"confirm","zh":"确认","example":"Could you confirm the room and unchanged price in writing?"},{"en":"in writing","zh":"书面地","example":"Could you confirm the room and unchanged price in writing?"},{"en":"arrangement","zh":"安排","example":"Let’s confirm the final arrangement."}],"phrases":[{"en":"That solution would work for me.","zh":"这个解决方案我可以接受。"},{"en":"Could you confirm it in writing?","zh":"请书面确认好吗？"}],"label":{"kind":"原创模拟材料","brand":"EVERYDAY ENGLISH · PRACTICE ONLY","title":"SERVICE CASE","subtitle":"完整协商：问题、方案与落实","price":"READ & UNDERSTAND","lines":[["Booking","A quiet double room for tw ogue":[{"role":"staff","en":"Good morning. Are you checking out?","zh":"早上好，你要退房吗？"},{"role":"you","en":"Yes. Can I leave my luggage here after check-out?","zh":"是的，退房后可以寄存行李吗？"},{"role":"staff","en":"Of course. When will you collect it?","zh":"当然，你什么时候来取？"},{"role":"you","en":"Around four. Is there a charge?","zh":"大概四点，收费吗？"},{"role":"staff","en":"It's free until six today. Please keep this tag.","zh":"今天六点前免费，请保管好这张凭条。"},{"role":"you","en":"Thank you. See you later.","zh":"谢谢，待会儿见。"}],"task":"完成退房，询问寄存和收费，再确认领取时间及凭条。","tip":"Luggage 通常作为不可数名词使用；“两件行李”可以说 two pieces of luggage。","stage":6,"legacy":true,"number":104},{"id":"w6d5","week":21,"day":5,"title":"出发前：完整一天挑战","goal":"独立完成购物、问路、点餐和酒店求助。","words":[{"en":"confirm","zh":"确认","example":"Could you confirm the time?"},{"en":"understand","zh":"理解；听懂","example":"I do not understand."},{"en":"mean","zh":"意思是","example":"What does this mean?"},{"en":"show","zh":"展示；指出","example":"Could you show me on the map?"},{"en":"assistance","zh":"帮助","example":"I need some assistance."}],"phrases":[{"en":"Could you show me on the map?","zh":"请在地图上指给我看，好吗？"},{"en":"Let me check that I understood.","zh":"让我确认一下我有没有理解对。"}],"label":{"kind":"全天任务卡","brand":"READY TO GO","title":"YOUR PRACTICE DAY","subtitle":"Connect everything you have learned","price":"4 MISSIONS","lines":[["09:00 · Shopping","Read a 500 ml bottle label and pay"],["11:00 · Getting around","Ask for the exit and confirm directions"],["13:00 · Lunch","Order a meal and a drink with less sugar"],["17:00 · Hotel","Ask to collect your stored luggage"]],"foot":"Try each mission before looking at the reference phrases."},"questions":[{"q":"对方说得太快时，哪种回应最有效？","options":["装作听懂","Could you speak more slowly, please?","直接随便回答 Yes"],"answer":1,"why":"主动请对方放慢，再核对关键信息，比假装听懂更能完成任务。"},{"q":"你要请对方在地图上指出位置，应说什么？","options":["Could you show me on the map?","Can I try this on?","Is breakfast included?"],"answer":0,"why":"Show me on the map：在地图上指给我看。"}],"dialogue":[{"role":"staff","en":" xample":"I'd like to reschedule booking M sixty-four."},{"en":"alternative","zh":"替代选项","example":"Task: Identify the tight timing, ask for an alternative lunch plan or walk slot, and confirm any change before relying on it."},{"en":"feasible","zh":"可行的","example":""}],"phrases":[{"en":"Would we still arrive in time?","zh":"我们还来得及吗？"},{"en":"We need to change one part of the plan.","zh":"我们需要改计划中的一部分。"}],"label":{"kind":"原创模拟材料","brand":"EVERYDAY ENGLISH · PRACTICE ONLY","title":"FINAL DAY-PLAN BRIEF","subtitle":"终局任务二：一天安排临时变动","price":"READ & UNDERSTAND","lines":[["Original plan","Leave the hotel at 9 a.m.; museum at 10 a.m.; lunch at noon; guided walk at 2 p.m."],["New information","The museum has moved your slot to 11 a.m. The visit takes ninety minutes. Lunch needs forty-five minutes, and travel from the café to the walk meeting point takes thirty minutes."],["Walk instruction","Arrive fifteen minutes before the start."],["Decision","Starting lunch immediately at 12:30 would finish at 1:15. The thirty-minute journey would arrive at 1:45, exactly the requested arrival time, with no buffer for delays."],["Task","Identify the tight timing, ask for an alternative lunch plan or walk slot, and confirm any change before relying on it."]],"foot":"Fictional learning material. Check real information when travelling."},"questions":[{"q":"按题中最顺利衔接，何时到步行活动集合点？","options":["13:45","14:15","13:15"],"answer":0,"why":"12:30+45分钟+30分钟=13:45。"},{"q":"为什么仍应考虑调整？","options":["数学上必然迟到两小时","完全没有延误缓冲","博物馆取消了"],"answer":1,"why":"时间刚好卡住提前到达要求，没有缓冲。"}],"dialogue":[{"role":"staff","en":"Your museum slot has moved to eleven.","zh":"你的博物馆时段改到十一点。"},{"role":"you","en":"The visit takes ninety minutes. That makes lunch quite tight.","zh":"参观九十分钟，这样午餐时间很紧。"},{"role":"staff","en":"What is your next booking?","zh":"下一项预约是什么？"},{"role":"you","en":"A guided walk at two, with arrival required at one forty-five.","zh":"两点的步行导览，要求一点四十五到。"},{"role":"staff","en":"Could you have a shorter lunch or change the walk slot?","zh":"可以缩短午餐或改导览时段吗？"},{"role":"you","en":"Is a later walk available?","zh":"有更晚的导览吗？"},{"role":"staff","en":"There may be one at three. I'll check.","zh":"可能有三点的，我查一下。"},{"role":"you","en":"Please also check whether changing it costs extra.","zh":"也请确认改时间是否加钱。"},{"role":"staff","en":"I'll confirm both details before updating the booking.","zh":"更新预订前我会确认两项。"},{"role":"you","en":"Thank you. We won't rely on the change until it is confirmed.","zh":"谢谢，确认之前我们不会按新安排计划。"}],"task":"先画出自己的时间顺序，再用英语指出风险、提出替代方案、确认费用和最终时间。","tip":"先自己尝试，再查看参考；练习时替换其中的时间、数量或需求。","number":117},{"id":"f118","week":24,"day":3,"stage":6,"title":"终局任务三：完成一次服务协商","goal":"不看提示连续协商五轮，至少说明故障、已做尝试、时间限制、想了解的方案和跟进方式。","words":[{"en":"evidence","zh":"凭据","example":"Evidence: Photo of the cup and packaging"},{"en":"resolution","zh":"解决办法","example":""},{"en":"reasonable","zh":"合理的","example":""},{"en":"accept","zh":"接受","example":"The refund is processed after we accept the return."},{"en":"follow-up","zh":"后续跟进","example":"Length guide: Speak for about one minute first, then answer three follow-up questions. For writing, aim for six to eight connected sentences rather than a list of words."}],"phrases":[{"en":"I would like to explain what happened.","zh":"我想说明发生了什么。"},{"en":"Could we agree on the next step?","zh":"我们能确定下一步吗？"}],"label":{"kind":"原创模拟材料","brand":"EVERYDAY ENGLISH · PRACTICE ONLY","title":"FINAL SERVICE BRIEF","subtitle":"终局任务三：完成一次服务协商","price":"READ & UNDERSTAND","lines":[["Purchase","A travel lamp, bought yesterday. You still have the receipt."],["Issue","It does not turn on after following the included instructions. Do not perform repairs as part of this exercise."],["Seller response","The item needs inspection before a remedy can be confirmed. Inspection is available tomorrow morning. You leave the city tomorrow afternoon."],["Your task","Explain what you tried, give your deadline, ask how long inspection takes and what options may follow. Do not assume an immediate refund is guaranteed. Agree how the shop will contact you and request a written summary."]],"foot":"Fictional learning material. Check real information when travelling."},"questions":[{"q":"卖方已保证立即退款了吗？","options":["已保证","没有，先检查","已经退款"],"answer":1,"why":"Inspection before remedy can be confirmed。"},{"q":"协商时必须说明什么约束？","options":["自己喜欢蓝色","今天想逛街","明天下午离开"],"answer":2,"why":"截止时间会影响可行处理方案。"}],"dialogue":[{"role":"staff","en":"Could you explain the problem?","zh":"你能说明问题吗？"},{"role":"you","en":"I bought this lamp yesterday. It won't turn on after I followed the instructions.","zh":"我昨天买的灯，按说明操作后仍打不开。"},{"role":"staff","en":"We need to inspect it before confirming a solution.","zh":"我们需要先检查再确认方案。"},{"role":"you","en":"I leave tomorrow afternoon. How long would inspection take?","zh":"我明天下午离开，检查需要多久？"},{"role":"staff","en":"We can inspect it tomorrow morning, but I need to confirm the timing.","zh":"可以明早检查，但时间细节要确认。"},{"role":"you","en":"What options might be available after the inspection?","zh":"检查后可能有哪些处理方式？"},{"role":"staff","en":"We'll explain them after we know the cause.","zh":"知道原因后我们会说明。"},{"role":"you","en":"Could we agree how you'll contact me and put the next step in writing?","zh":"可以确定联系方式并书面写明下一步吗？"},{"role":"staff","en":"Yes. We'll provide a case reference and a written summary.","zh":"可以，我们给你案例编号和书面摘要。"},{"role":"you","en":"Thank you. I'll keep those with my receipt.","zh":"谢谢，我会和小票一起保管。"}],"task":"不看提示连续协商五轮，至少说明故障、已做尝试、时间限制、想了解的方案和跟进方式。","tip":"先自己尝试，再查看参考；练习时替换其中的时间、数量或需求。","number":118},{"id":"f119","week":24,"day":4,"stage":6,"title":"终局任务四：用自己的话讲清楚","goal":"写六到八句自己的经历，再不看稿说一分钟。","words":[{"en":"summary","zh":"总结","example":"Yes. We'll provide a case reference and a written summary."},{"en":"reason","zh":"原因","example":"The main reason was that we needed more time."},{"en":"detail","zh":"细节","example":"Key detail: The booking was not changed; only the entrance was corrected."},{"en":"experience","zh":"经历","example":"Your turn: Share one related experience rather than changing the subject immediately."},{"en":"improve","zh":"改进","example":"Language support: Use past forms for completed events, because for reasons, but or however for contrasts, and next time for future improvements."}],"phrases":[{"en":"The main reason was that we needed more time.","zh":"主要原因是我们需要更多时间。"},{"en":"Next time, I would plan it differently.","zh":"下次我会用不同方式安排。"}],"label":{"kind":"原创模拟材料","brand":"EVERYDAY ENGLISH · PRACTICE ONLY","title":"PERSONAL ACCOUNT TASK","subtitle":"终局任务四：用自己的话讲清楚","price":"READ & UNDERSTAND","lines":[["Prompt","Tell a friend about a day when a plan changed. Explain the original plan, what changed, what you did, and how it ended. Finish with one lesson for next time."],["Length guide","Speak for about one minute first, then answer three follow-up questions. For writing, aim for six to eight connected sentences rather than a list of words."],["Language support","Use past forms for completed events, because for reasons, but or however for contrasts, and next time for future improvements."],["Privacy","Use an invented event if you prefer; no real names, document numbers or addresses are needed."]],"foot":"Fictional learning material. Check real information when travelling."},"questions":[{"q":"这项任务要求哪种组织方式？","options":["只列地点名","只说喜欢不喜欢","原计划→变化→行动→结果→改进"],"answer":2,"why":"Prompt 给出了完整叙述顺序。"},{"q":"为什么还要回答追问？","options":["检验是否能灵活交流而不只是背稿","为了背更多固定答案","不用理解问题"],"answer":0,"why":"独立交流需要回应新的问题。"}],"dialogue":[{"role":"staff","en":"Tell me about a time your plan changed.","zh":"讲讲一次计划有变的经历。"},{"role":"you","en":"We planned to visit a museum, but our time slot changed.","zh":"我们原计划参观博物馆，但预约时段改了。"},{"role":"staff","en":"What did you do?","zh":"你们怎么做的？"},{"role":"you","en":"We moved lunch earlier because we needed more time afterwards.","zh":"我们提前午餐，因为之后需要更多时间。"},{"role":"staff","en":"Was everyone happy with that?","zh":"大家都满意吗？"},{"role":"you","en":"Yes. We discussed the options and agreed on the new plan.","zh":"满意，我们讨论选项后同意了新安排。"},{"role":"staff","en":"What was the result?","zh":"结果怎么样？"},{"role":"you","en":"We arrived on time and enjoyed the visit.","zh":"我们准时到了，参观也很开心。"},{"role":"staff","en":"What would you change next time?","zh":"下次会改进什么？"},{"role":"you","en":"I'd leave more time between bookings.","zh":"我会在预约之间留更多时间。"}],"task":"写六到八句自己的经历，再不看稿说一分钟。请同伴问三个未准备过的问题，记录没接住的地方。","tip":"先自己尝试，再查看参考；练习时替换其中的时间、数量或需求。","number":119},{"id":"f120","week":24,"day":5,"stage":6,"title":"终局任务五：完整旅程验收","goal":"完成第六阶段陌生材料验收与开口清单。","words":[{"en":"independent","zh":"独立的","example":""},{"en":"clarify","zh":"澄清","example":"Could you clarify which items do qualify?"},{"en":"verify","zh":"核实","example":"Reply: A black bag has been found, but the desk needs to verify ownership. It has no visible name label."},{"en":"priority","zh":"优先事项","example":"My priority is low weight."},{"en":"maintain","zh":"保持","example":""}],"phrases":[{"en":"Could you clarify the part about the deadline?","zh":"能解释一下关于截止时间的部分吗？"},{"en":"Let me summarise what we have agreed.","zh":"让我总结一下我们商定的内容。"}],"label":{"kind":"原创模拟材料","brand":"EVERYDAY ENGLISH · PRACTICE ONLY","title":"FINAL INDEPENDENT CHALLENGE","subtitle":"终局任务五：完整旅程验收","price":"READ & UNDERSTAND","lines":[["Morning","Read two unfamiliar product descriptions. Choose the one that meets a budget and a size requirement. Explain a condition that could change your decision."],["Midday","Order food for two people, answer two follow-up questions, and correct one intentional order mistake."],["Afternoon","Ask for directions after a route changes. Confirm where to board, the next departure and expected travel time."],["Evening","Explain a room problem and request an appropriate next step. Then hold a short conversation about your day."],["Evidence","Save a short written account and honestly complete the stage-six speaking checklist. New prompts from a partner are more informative than repeating memorised scripts."]],"foot":"Fictional learning material. Check real information when travelling."},"questions":[{"q":"看懂商品的验收不应只看什么？","options":["是否认识品牌和价格","是否能解释条件","是否符合预算与尺寸"],"answer":0,"why":"只认品牌价格不足以完成任务。"},{"q":"真实开口能力应如何补充检验？","options":["反复背同一段就算通过","请同伴问未准备的问题","只看选择题分数"],"answer":1,"why":"陌生追问可以检查迁移而非仅背诵。"}],"dialogue":[{"role":"staff","en":"Your selected item does not qualify for the discount.","zh":"你选的商品不参加折扣。"},{"role":"you","en":"Could you clarify which items do qualify?","zh":"能说明哪些商品参加吗？"},{"role":"staff","en":"Only the smaller size, and you must buy two.","zh":"只有小号，而且必须买两件。"},{"role":"you","en":"Then I'll buy one at the regular price. What is the final total?","zh":"那我买一件原价的，最终总价多少？"},{"role":"staff","en":"Eighteen dollars. Would you like a bag?","zh":"十八元，要袋子吗？"},{"role":"you","en":"No, thank you. I have my own. Could I have a receipt?","zh":"不用，我自己有，请给我小票。"},{"role":"staff","en":"Certainly. Is there anything else?","zh":"当然，还有别的吗？"},{"role":"you","en":"Yes. Where is the nearest bus stop?","zh":"有，最近的公交站在哪里？"},{"role":"staff","en":"Outside the side entrance. Please check the destination on the bus.","zh":"在侧门外，请核对车上的目的地。"},{"role":"you","en":"Thank you. I'll confirm the route before boarding.","zh":"谢谢，上车前我会确认路线。"}],"task":"完成第六阶段陌生材料验收与开口清单。薄弱项回对应课程复练；达标后进入长期保持，而非继续机械刷相同题。","tip":"结业表示完成这条任务型路径，不等于英语“全学完”或正式达到某个 CEFR 等级。","number":120}],"weeks":[{"n":1,"name":"字母、数字与价格","en":"WEEK 01","goal":"从姓名拼写到金额确认","test":"用已学材料复测理解，再用不同条件练一次开口。","stage":1,"grammar":{"title":"字母名称 ≠ 单词读音","explain":"拼姓名时读字母名称；读单词时把字母组合成发音。先听再跟读，不用中文谐音作唯一依据。","form":"My name is ... / It is spelled ...","examples":[{"en":"My surname is Lin.","zh":"我姓林。"},{"en":"It is spelled L, I, N.","zh":"拼作 L、I、N。"}]}},{"n":2,"name":"时间、位置与单位","en":"WEEK 02","goal":"能说清什么时候、在哪里、多大","test":"用已学材料复测理解，再用不同条件练一次开口。","stage":1,"grammar":{"title":"时间、日期、位置前的小词","explain":"at 常用于钟点，on 用于星期或日期，in 用于月份或较宽的时段。这里先学常用组合，不一次背完所有例外。","form":"at 3 p.m. / on Tuesday / in June","examples":[{"en":"Meet me at three on Tuesday.","zh":"星期二三点见。"},{"en":"The lift is next to the stairs.","zh":"电梯在楼梯旁。"}]}},{"n":3,"name":"句子的骨架","en":"WEEK 03","goal":"用简单句表达需求与提问","test":"用已学材料复测理解，再用不同条件练一次开口。","stage":1,"grammar":{"title":"先分清状态与动作","explain":"状态可用 I am / it is；拥有用 I have；需求用 I need。一般现在时的动作问句常用 do / does，不说 Do you are...?","form":"I am ... / I have ... / I need ... / Do you have ...?","examples":[{"en":"I am ready.","zh":"我准备好了。"},{"en":"Do you have a smaller size?","zh":"有小一码的吗？"}]}},{"n":4,"name":"把基础连起来","en":"WEEK 04","goal":"习惯、比较、限制和确认","test":"用已学材料复测理解，再用不同条件练一次开口。","stage":1,"grammar":{"title":"否定与比较都要读到","explain":"not、only、except 会改变意思；形容词比较常用 -er 或 more。先掌握 cheaper、bigger 和 more expensive 等常用搭配。","form":"A is cheaper than B. / ... not ... / ... only","examples":[{"en":"This one is cheaper than that one.","zh":"这件比那件便宜。"},{"en":"Water is allowed, but food is not.","zh":"允许水，但不允许食物。"}]}},{"n":5,"name":"购物与付款","en":"WEEK 05","goal":"价格、数量、优惠与尺寸","test":"用已学材料复测理解，再用不同条件练一次开口。","stage":2,"grammar":{"title":"不可数与可数：用包装来数","explain":"water 本身通常不直接加复数；可以数 bottle。价格问 how much，件数问 how many。","form":"a bottle of water / two bottles of water","examples":[{"en":"How many bottles would you like?","zh":"你想要几瓶？"},{"en":"How much are these?","zh":"这些多少钱？"}]}},{"n":6,"name":"商品信息入门","en":"WEEK 06","goal":"成分、储存、材质与配件","test":"用已学材料复测理解，再用不同条件练一次开口。","stage":2,"grammar":{"title":"读标签先找动作与限制","explain":"标签常省略完整句子。Store、Keep、Wash 是动作；Do not 是禁止；after opening 给出条件或时间。","form":"Store ... / Keep ... / Do not ...","examples":[{"en":"Keep refrigerated after opening.","zh":"开封后保持冷藏。"},{"en":"Do not tumble dry.","zh":"不要滚筒烘干。"}]}},{"n":7,"name":"规格与使用说明","en":"WEEK 07","goal":"份量、包装、护理与兼容","test":"用已学材料复测理解，再用不同条件练一次开口。","stage":2,"grammar":{"title":"每份、每包、每件别混淆","explain":"per serving / per pack / per item 指不同计算单位。包含用 included，不包含用 not included，单独购买用 sold separately。","form":"per ... / included / sold separately","examples":[{"en":"Is that per serving or per pack?","zh":"那是每份还是整包？"},{"en":"The cable is sold separately.","zh":"连接线另售。"}]}},{"n":8,"name":"条件与比较购买","en":"WEEK 08","goal":"折扣、缺货、退换与配送","test":"用已学材料复测理解，再用不同条件练一次开口。","stage":2,"grammar":{"title":"条件句：先找到 if / when / subject to","explain":"if 后说明条件，when 后说明何时或什么情况下；subject to availability 表示看余量，不能读成无条件保证。","form":"If ... / when ... / subject to ...","examples":[{"en":"Can I exchange it if it does not fit?","zh":"不合适可以换吗？"},{"en":"Changes are subject to availability.","zh":"更改取决于余量。"}]}},{"n":9,"name":"点餐与饮料","en":"WEEK 09","goal":"下单、偏好、订位与结账","test":"用已学材料复测理解，再用不同条件练一次开口。","stage":3,"grammar":{"title":"点餐用 would like，不只用 want","explain":"I would like / I’d like 是常用礼貌表达。Anything else? 是在问还有没有其他需求。","form":"I’d like ... / ... please / That’s all, thank you.","examples":[{"en":"I'd like a small tea, please.","zh":"请给我小杯茶。"},{"en":"For takeaway, please.","zh":"请打包。"}]}},{"n":10,"name":"问路与交通","en":"WEEK 10","goal":"出口、换乘、方向与门票","test":"用已学材料复测理解，再用不同条件练一次开口。","stage":3,"grammar":{"title":"问路要问完整，也要复述","explain":"Where is ...? 问位置，Which ... should I take? 问选哪条路。Then / at / opposite 等词决定动作与位置。","form":"Go straight, then turn ...","examples":[{"en":"Which exit should I take?","zh":"我该走哪个出口？"},{"en":"Turn left at the bank.","zh":"在银行处左转。"}]}},{"n":11,"name":"吃饭中的追问","en":"WEEK 11","goal":"等位、配菜、调整、错单与账单","test":"用已学材料复测理解，再用不同条件练一次开口。","stage":3,"grammar":{"title":"一般过去式用于纠正订单","explain":"I ordered ... 表示之前点了什么；not ... 否定收到的错误项目。Does it come with ...? 询问包含项。","form":"I ordered A, not B. / Could you replace it?","examples":[{"en":"I ordered tea, not coffee.","zh":"我点的是茶，不是咖啡。"},{"en":"Could I have the sauce on the side?","zh":"酱汁可以另放吗？"}]}},{"n":12,"name":"移动中的变化","en":"WEEK 12","goal":"换乘、延误、打车、改期","test":"用已学材料复测理解，再用不同条件练一次开口。","stage":3,"grammar":{"title":"变化后的信息比最初版本重要","explain":"instead of 用来替换原方案；still 表示未改变；not cancelled 与 delayed 不能混读。","form":"A instead of B / still / changed to ...","examples":[{"en":"Use platform five instead of platform two.","zh":"改用五号站台，不是二号。"},{"en":"The meeting time is still three.","zh":"见面时间仍是三点。"}]}},{"n":13,"name":"酒店与求助入门","en":"WEEK 13","goal":"入住、设施、失物与聊天","test":"用已学材料复测理解，再用不同条件练一次开口。","stage":4,"grammar":{"title":"说明问题：对象＋状态","explain":"用具体对象作主语：The air conditioning is not working。用 room number 和 when 补充地点与开始时间。","form":"The ... is not working. / I have lost ...","examples":[{"en":"The air conditioning isn't working.","zh":"空调不能正常工作。"},{"en":"I've lost my bag.","zh":"我的包丢了。"}]}},{"n":14,"name":"住宿服务细节","en":"WEEK 14","goal":"费用、故障、洗衣与联络","test":"用已学材料复测理解，再用不同条件练一次开口。","stage":4,"grammar":{"title":"费用和期限：from / by / per","explain":"from 是起始，by 常表示不晚于，per 表示每。refundable 之后还要继续看是否附有条件。","form":"from 3 p.m. / by 11 a.m. / per night","examples":[{"en":"Check-out is by eleven.","zh":"最迟十一点退房。"},{"en":"Is there an extra charge?","zh":"有额外费用吗？"}]}},{"n":15,"name":"谈自己与生活","en":"WEEK 15","goal":"家人、兴趣、过去与计划","test":"用已学材料复测理解，再用不同条件练一次开口。","stage":4,"grammar":{"title":"把昨天、平时与明天分开","explain":"平时用一般现在时；昨天已完成的事用过去式；计划可用 be going to。先保证时间意思清楚，再逐渐减少形式错误。","form":"I usually ... / Yesterday I ... / Tomorrow I am going to ...","examples":[{"en":"I bought a notebook yesterday.","zh":"我昨天买了一本笔记本。"},{"en":"I'm going to visit the museum tomorrow.","zh":"我明天打算参观博物馆。"}]}},{"n":16,"name":"沟通与服务","en":"WEEK 16","goal":"约见、电话、消息与求助","test":"用已学材料复测理解，再用不同条件练一次开口。","stage":4,"grammar":{"title":"消息与电话按目的组织","explain":"不必写长句。先说明为什么联系，再给关键信息，最后请求确认。until 强调到某时才可；after 强调某时之后。","form":"I’m calling to ... / I’ll arrive ... / Please confirm ...","examples":[{"en":"I'm calling to confirm my booking.","zh":"我打电话确认预订。"},{"en":"I won't be available until four.","zh":"我四点才有空。"}]}},{"n":17,"name":"投诉与协商","en":"WEEK 17","goal":"事实、期限、方案与落实","test":"用已学材料复测理解，再用不同条件练一次开口。","stage":5,"grammar":{"title":"协商需要事实、理由与条件","explain":"because 说明为什么；would prefer 表达更希望的方案；after acceptance 等短语确定处理时间起点。","form":"I would prefer ... because ... / after ...","examples":[{"en":"I would prefer a refund because I am leaving soon.","zh":"我快离开了，所以更希望退款。"},{"en":"How long will it take after acceptance?","zh":"接受后需要多久？"}]}},{"n":18,"name":"更长的商品说明","en":"WEEK 18","goal":"卖点、条件、评论与取舍","test":"用已学材料复测理解，再用不同条件练一次开口。","stage":5,"grammar":{"title":"长句拆成主干＋限定","explain":"先找谁做什么，再看 who / that / which 修饰谁。up to 不是必达值；although / however 常引出反差或限制。","form":"main idea + condition / however / although","examples":[{"en":"Items that are already discounted do not count.","zh":"已打折商品不计入。"},{"en":"Actual performance depends on use.","zh":"实际表现取决于使用方式。"}]}},{"n":19,"name":"自然延伸对话","en":"WEEK 19","goal":"经历、追问、理由与协商","test":"用已学材料复测理解，再用不同条件练一次开口。","stage":5,"grammar":{"title":"延伸对话：回应＋追问＋分享","explain":"听完不只回答 yes/no。简短回应、追问一个相关细节，再分享自己的经历或偏好。","form":"That sounds ... / What was ...? / I also ...","examples":[{"en":"What did you enjoy most?","zh":"你最喜欢什么？"},{"en":"I enjoy making things too.","zh":"我也喜欢动手做东西。"}]}},{"n":20,"name":"信息整合与确认","en":"WEEK 20","goal":"顺序、更正、不确定与代词","test":"用已学材料复测理解，再用不同条件练一次开口。","stage":5,"grammar":{"title":"按逻辑，而非按字面顺序理解","explain":"before/after 决定步骤；actually/I meant 表示更正；probably 表示不确定；it/that one 需要回找所指。","form":"first → then → before/after → finally","examples":[{"en":"Check the item before signing.","zh":"签字之前检查商品。"},{"en":"I meant Thursday, not Tuesday.","zh":"我是说周四，不是周二。"}]}},{"n":21,"name":"串联常见场景","en":"WEEK 21","goal":"重用早期技能，不止背单句","test":"用已学材料复测理解，再用不同条件练一次开口。","stage":6,"grammar":{"title":"把常用句换成自己的条件","explain":"复现早期句型，但改变商品、人数、数量、时间与预算。能更换变量而不失去意思，比照读完整段落更重要。","form":"request → follow-up → confirm","examples":[{"en":"Can I choose two different flavours?","zh":"我能选两种不同口味吗？"},{"en":"Let me check that I understood.","zh":"让我确认我是否理解对了。"}]}},{"n":22,"name":"带变化的旅行日","en":"WEEK 22","goal":"预算、人数、时间与限制","test":"用已学材料复测理解，再用不同条件练一次开口。","stage":6,"grammar":{"title":"多任务先说硬性条件","explain":"budget、by、at least、at most、not more than 会限制选项。用一句话先说明不能改变的要求，再讨论替代。","form":"I need ... by ... / at least ... / at most ...","examples":[{"en":"I need to arrive before three.","zh":"我需要三点前到。"},{"en":"Our budget is thirty-five dollars.","zh":"我们的预算是三十五元。"}]}},{"n":23,"name":"不看稿解决任务","en":"WEEK 23","goal":"电话、邮件、比较与跟进","test":"用已学材料复测理解，再用不同条件练一次开口。","stage":6,"grammar":{"title":"独立交流：核实而不是猜","explain":"通过追问获得缺失信息；电话需要拼写和复述；邮件回复包含编号、改变项与未改变项。","form":"Could you read that back? / Please confirm ...","examples":[{"en":"Could you read the details back to me?","zh":"可以复述详情吗？"},{"en":"Please confirm that the price is unchanged.","zh":"请确认价格不变。"}]}},{"n":24,"name":"最后的独立挑战","en":"WEEK 24","goal":"购物、行程、服务与完整叙述","test":"用已学材料复测理解，再用不同条件练一次开口。","stage":6,"grammar":{"title":"完整表达不等于复杂语法","explain":"用短句也能完成复杂任务：事实→限制→选择→理由→确认。讲经历则用原计划→变化→行动→结果→改进。","form":"facts → needs → options → agreement","examples":[{"en":"Let me summarise what we have agreed.","zh":"让我总结我们商定的内容。"},{"en":"Next time, I'd leave more time between bookings.","zh":"下次我会在预约之间多留些时间。"}]}}],"stages":[{"id":1,"name":"基础打底","en":"FOUNDATION","span":"第 1–4 周","goal":"听清数字，拼姓名，能自己造简单句。","skills":["不看稿介绍自己并拼姓名；数字没听清时主动确认。","读懂一张陌生短通知的时间、地点和限制。","用简单句提出两项需求，并接住至少三轮问答。"],"firstWeek":1,"lastWeek":4,"exam":{"material":"VISITOR APPOINTMENT — NEW PRACTICE MATERIAL\nName: Jia Wu. Surname: Wu.\nDay: Wednesday. Start: 2:15 p.m. Duration: 45 minutes.\nMeeting place: Level 3, opposite the lift.\nBring one pen. Food is not allowed. Water is allowed.","questions":[{"id":"stage1:q0","lesson":"f001","type":"reading","q":"哪个是姓？","options":["Jia","Wu","Jia Wu"],"answer":1,"why":"Surname: Wu。","material":"VISITOR APPOINTMENT — NEW PRACTICE MATERIAL\nName: Jia Wu. Surname: Wu.\nDay: Wednesday. Start: 2:15 p.m. Duration: 45 minutes.\nMeeting place: Level 3, opposite the lift.\nBring one pen. Food is not allowed. Water is allowed."},{"id":"stage1:q1","lesson":"f001","type":"reading","q":"几点开始？","options":["02:15","14:45","14:15"],"answer":2,"why":"2:15 p.m. 是下午两点十五分。","material":"VISITOR APPOINTMENT — NEW PRACTICE MATERIAL\nName: Jia Wu. Surname: Wu.\nDay: Wednesday. Start: 2:15 p.m. Duration: 45 minutes.\nMeeting place: Level 3, opposite the lift.\nBring one pen. Food is not allowed. Water is allowed."},{"id":"stage1:q2","lesson":"f001","type":"reading","q":"集合地点在电梯哪里？","options":["对面","里面","右边"],"answer":0,"why":"Opposite the lift。","material":"VISITOR APPOINTMENT — NEW PRACTICE MATERIAL\nName: Jia Wu. Surname: Wu.\nDay: Wednesday. Start: 2:15 p.m. Duration: 45 minutes.\nMeeting place: Level 3, opposite the lift.\nBring one pen. Food is not allowed. Water is allowed."},{"id":"stage1:q3","lesson":"f001","type":"reading","q":"哪项允许带入？","options":["食物","水","任何东西"],"answer":1,"why":"Water is allowed；food is not allowed。","material":"VISITOR APPOINTMENT — NEW PRACTICE MATERIAL\nName: Jia Wu. Surname: Wu.\nDay: Wednesday. Start: 2:15 p.m. Duration: 45 minutes.\nMeeting place: Level 3, opposite the lift.\nBring one pen. Food is not allowed. Water is allowed."},{"id":"stage1:q4","lesson":"f001","type":"listen","q":"小盒多少钱？","spoken":"The small box is fourteen dollars, not forty.","options":["40 元","44 元","14 元"],"answer":2,"why":"Fourteen 不是 forty。"},{"id":"stage1:q5","lesson":"f001","type":"listen","q":"几点到？","spoken":"Please arrive at a quarter past two in the afternoon.","options":["14:15","14:45","02:15"],"answer":0,"why":"A quarter past two 是两点十五分；in the afternoon 是下午。"},{"id":"stage1:q6","lesson":"f001","type":"listen","q":"对方希望你做什么？","spoken":"Could you spell your surname, please?","options":["告诉年龄","拼写姓氏","重复房价"],"answer":1,"why":"Spell your surname。"},{"id":"stage1:q7","lesson":"f001","type":"listen","q":"到电梯处往哪里转？","spoken":"Go straight and turn right at the lift.","options":["左转","掉头","右转"],"answer":2,"why":"Turn right at the lift。"}]}},{"id":2,"name":"购物与商品信息","en":"READ & SHOP","span":"第 5–8 周","goal":"读懂关键信息和限制，比较后买对东西。","skills":["从陌生标签找出规格、价格、储存或使用要求。","不看稿询价、提需求、确认付款，至少三轮问答。","比较两款商品，说明选择与一条不能忽略的条件。"],"firstWeek":5,"lastWeek":8,"exam":{"material":"NEW PRODUCT CARD — FICTIONAL\nHand soap refill: 600 ml, $7 each.\nOffer: Two refills for $12; selected scents only; no membership required.\nPump bottle: Not included; $3 separately.\nInstructions: For external use only. Keep the cap closed after use.\nExchange: Unused products only, within five days with the original receipt.\nNeed: You have no pump bottle and want two qualifying refills plus one pump bottle.","questions":[{"id":"stage2:q0","lesson":"w1d1","type":"reading","q":"按需求购买总价是多少？","options":["12 元","17 元","15 元"],"answer":2,"why":"两个合资格补充装12元，加瓶3元。","material":"NEW PRODUCT CARD — FICTIONAL\nHand soap refill: 600 ml, $7 each.\nOffer: Two refills for $12; selected scents only; no membership required.\nPump bottle: Not included; $3 separately.\nInstructions: For external use only. Keep the cap closed after use.\nExchange: Unused products only, within five days with the original receipt.\nNeed: You have no pump bottle and want two qualifying refills plus one pump bottle."},{"id":"stage2:q1","lesson":"w1d1","type":"reading","q":"两包补充装的总容量？","options":["1200 ml","600 ml","300 ml"],"answer":0,"why":"每包600ml，两包1200ml。","material":"NEW PRODUCT CARD — FICTIONAL\nHand soap refill: 600 ml, $7 each.\nOffer: Two refills for $12; selected scents only; no membership required.\nPump bottle: Not included; $3 separately.\nInstructions: For external use only. Keep the cap closed after use.\nExchange: Unused products only, within five days with the original receipt.\nNeed: You have no pump bottle and want two qualifying refills plus one pump bottle."},{"id":"stage2:q2","lesson":"w1d1","type":"reading","q":"是否必须加入会员？","options":["必须","不必","买瓶子才不用"],"answer":1,"why":"No membership required。","material":"NEW PRODUCT CARD — FICTIONAL\nHand soap refill: 600 ml, $7 each.\nOffer: Two refills for $12; selected scents only; no membership required.\nPump bottle: Not included; $3 separately.\nInstructions: For external use only. Keep the cap closed after use.\nExchange: Unused products only, within five days with the original receipt.\nNeed: You have no pump bottle and want two qualifying refills plus one pump bottle."},{"id":"stage2:q3","lesson":"w1d1","type":"reading","q":"换货条件是什么？","options":["只需说不喜欢","任何时候均可","未使用、五天内、原始小票"],"answer":2,"why":"三项条件要一起满足。","material":"NEW PRODUCT CARD — FICTIONAL\nHand soap refill: 600 ml, $7 each.\nOffer: Two refills for $12; selected scents only; no membership required.\nPump bottle: Not included; $3 separately.\nInstructions: For external use only. Keep the cap closed after use.\nExchange: Unused products only, within five days with the original receipt.\nNeed: You have no pump bottle and want two qualifying refills plus one pump bottle."},{"id":"stage2:q4","lesson":"w1d1","type":"listen","q":"现在哪种有货？","spoken":"The blue one is out of stock, but the green one is available.","options":["绿色","蓝色","都没有"],"answer":0,"why":"Green one is available。"},{"id":"stage2:q5","lesson":"w1d1","type":"listen","q":"价格单位是什么？","spoken":"That's the price per pack, not per item.","options":["每件","每包","每克"],"answer":1,"why":"Per pack，不是per item。"},{"id":"stage2:q6","lesson":"w1d1","type":"listen","q":"享受优惠需满足什么？","spoken":"The discount applies only if you buy three.","options":["买一件","无需购买","买三件"],"answer":2,"why":"Only if you buy three。"},{"id":"stage2:q7","lesson":"w1d1","type":"listen","q":"需要另买什么？","spoken":"The cable is included, but the power adapter is sold separately.","options":["电源适配器","连接线","两者都要"],"answer":0,"why":"Power adapter is sold separately。"}]}},{"id":3,"name":"餐饮、交通与外出","en":"GO ABOUT YOUR DAY","span":"第 9–12 周","goal":"听懂追问，能应对订单和路线的变化。","skills":["为两人点餐并回答大小、口味、堂食或打包等追问。","遇到路线变更时问清新地点、时间与乘车方式。","听不懂时要求重说并复述，不以猜测的 Yes 结束交流。"],"firstWeek":9,"lastWeek":12,"exam":{"material":"A NEW OUTING — FICTIONAL\nLunch booking: Two people at 12:30 p.m.; please arrive ten minutes early.\nMenu: Set meal $11 per person, including one drink. Dessert costs $4 extra.\nAfter lunch: Bus R leaves from Bay D at 2:05 p.m. and takes 25 minutes.\nUpdate: Bay C is closed. Use Bay D. The museum's last admission is 4 p.m.\nNeed: Two set meals and one shared dessert, then travel to the museum.","questions":[{"id":"stage3:q0","lesson":"w3d1","type":"reading","q":"预约要求几点到餐厅？","op <script>
'use strict';
const DATA=JSON.parse(document.getElementById('course-data').textContent);
const LESSONS=DATA.lessons, WEEKS=DATA.weeks, STAGES=DATA.stages;
const LESSON_MAP=Object.assign(Object.create(null),Object.fromEntries(LESSONS.map(l=>[l.id,l])));
const ENTRIES=LESSONS.flatMap(l=>[...l.words.map((x,i)=>({...x,id:l.id+':w'+i,type:'word',lesson:l.id,week:l.week})),...l.phrases.map((x,i)=>({...x,id:l.id+':p'+i,type:'phrase',lesson:l.id,week:l.week}))]);
const ENTRY_MAP=Object.assign(Object.create(null),Object.fromEntries(ENTRIES.map(x=>[x.id,x])));
let STORAGE_KEY=window.EnglishSync.storageKey();
const $=s=>document.querySelector(s);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic=n=>`<svg class="icon" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const btn=(text,attrs='',cls='')=>`<button class="button ${cls}" ${attrs}>${text}</button>`;
const speakBtn=(text,small=false)=>`<button class="icon-btn" data-say="${esc(text)}" aria-label="朗读：${esc(text)}" title="朗读英文">${ic('speaker')}</button>`;
function localDate(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function validDate(s){if(typeof s!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s))return false; const d=new Date(s+'T12:00:00');return !isNaN(d)&&localDate(d)===s;}
function addDays(date,n){let d=new Date(date+'T12:00:00');d.setDate(d.getDate()+n);return localDate(d);}
function dayDiff(a,b){return Math.round((Date.parse(a+'T12:00:00Z')-Date.parse(b+'T12:00:00Z'))/86400000);}
function shortDate(d){return Number(d.slice(5,7))+'/'+Number(d.slice(8,10));}
function defaults(){return {version:1,start:localDate(),completed:{},scores:{},weekly:{},review:{},favorites:[],activity:[],mistakes:{},oral:{},lastLesson:'w1d1',settings:{rate:.85,voice:'',departure:'',showTranslation:true}};}
function object(x){return x&&typeof x==='object'&&!Array.isArray(x);}
function normalise(raw){
 const s=defaults(); if(!object(raw))return s;
 if(validDate(raw.start))s.start=raw.start;
 for(const k of ['completed','oral'])if(object(raw[k]))for(const [id,date] of Object.entries(raw[k]))if(LESSON_MAP[id]&&validDate(date))s[k][id]=date;
 for(const k of ['scores','weekly'])if(object(raw[k]))for(const [id,r] of Object.entries(raw[k]))if((k==='scores'?LESSON_MAP[id]:/^[1-6]$/.test(id))&&object(r)&&Number.isFinite(r.best))s[k][id]={best:Math.max(0,Math.min(100,Math.round(r.best))),last:Math.max(0,Math.min(100,Math.round(Number(r.last)||0))),date:validDate(r.date)?r.date:localDate()};
 if(object(raw.review))for(const [id,r] of Object.entries(raw.review))if(ENTRY_MAP[id]&&object(r)&&validDate(r.due))s.review[id]={level:Math.max(0,Math.min(5,Math.trunc(Number(r.level)||0))),due:r.due,lapses:Math.max(0,Math.trunc(Number(r.lapses)||0)),seen:Math.max(0,Math.trunc(Number(r.seen)||0))};
 if(Array.isArray(raw.favorites))s.favorites=[...new Set(raw.favorites.filter(id=>typeof id==='string'&&ENTRY_MAP[id]))];
 if(Array.isArray(raw.activity))s.activity=[...new Set(raw.activity.filter(validDate))].sort().slice(-3000);
 if(object(raw.mistakes))for(const [id,r] of Object.entries(raw.mistakes))if(/^(w[1-6]d[1-5]):(r0|r1|word|phrase|listen)$/.test(id)&&object(r))s.mistakes[id]={count:Math.max(1,Math.trunc(Number(r.count)||1)),date:validDate(r.date)?r.date:localDate()};
 if(LESSON_MAP[raw.lastLesson])s.lastLesson=raw.lastLesson;
 if(object(raw.settings)){let t=raw.settings;s.settings.rate=Math.max(.6,Math.min(1.2,Number(t.rate)||.85));s.settings.voice=typeof t.voice==='string'?t.voice.slice(0,400):'';s.settings.departure=validDate(t.departure)?t.departure:'';s.settings.showTranslation=t.showTranslation!==false;}
 return s;
}
let storageOK=true,state=defaults();
try{const r=localStorage.getItem(STORAGE_KEY)||(STORAGE_KEY==='departureEnglish.sg.v2'?localStorage.getItem('departureEnglish.sg.v1'):null);if(r)state=normalise(JSON.parse(r));localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){storageOK=false;}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(window.EnglishSync.pack(state)));storageOK=true;}catch(e){storageOK=false;storageWarning();}window.EnglishSync.changed(state);}
function storageWarning(){const b=$('#storage-warning');b.hidden=storageOK;if(!storageOK)b.textContent='当前浏览器未能保存学习记录。课程仍可使用；离开前请在“设置与备份”导出记录，或使用本地服务器打开。';}
function logActivity(){let today=localDate();if(!state.activity.includes(today)){state.activity.push(today);state.activity.sort();}save();}
function streak(){const days=new Set(state.activity);let d=localDate(),n=0;if(!days.has(d))d=addDays(d,-1);while(days.has(d)){n++;d=addDays(d,-1);}return n;}
function dueIDs(){return Object.keys(state.review).filter(id=>state.review[id].due<=localDate()).sort((a,b)=>state.review[a].due.localeCompare(state.review[b].due));}
function learned(){return Object.keys(state.completed).length;}
function nextLesson(){if(LESSON_MAP[state.lastLesson]&&!state.completed[state.lastLesson])return LESSON_MAP[state.lastLesson];return LESSONS.find(l=>!state.completed[l.id])||LESSONS[29];}
function toast(text){clearTimeout(toast.timeout);$('#toast').textContent=text;$('#toast').classList.add('show');toast.timeout=setTimeout(()=>$('#toast').classList.remove('show'),3300);}
let confirmAction=null;
function modal(html,onConfirm=null){stopSpeech();confirmAction=onConfirm;$('#dialog-content').innerHTML=html;const d=$('#dialog');if(!d.open)d.showModal();}
function confirmModal(title,body,onConfirm,destructive=false){modal(`<h2>${esc(title)}</h2><p>${esc(body)}</p><div class="row">${btn('取消','data-action="closemodal"','ghost')}${btn('确认','data-action="confirmmodal"',destructive?'danger':'')}</div>`,onConfirm);}
function closeModal(){if($('#dialog').open)$('#dialog').close();confirmAction=null;}
// Voice is supplied by the browser/operating system. No remote speech API is called here.
let voices=[],utterance=null,speechToken=0;
function refreshVoices(){if('speechSynthesis'in window)voices=speechSynthesis.getVoices().filter(v=>/^en([-_]|$)/i.test(v.lang));if(location.hash.startsWith('#settings'))fillVoices();}
function chosenVoice(){return voices.find(v=>v.voiceURI===state.settings.voice)||voices.find(v=>v.localService&&/^en[-_]GB/i.test(v.lang))||voices.find(v=>v.localService)||voices.find(v=>/^en[-_]GB/i.test(v.lang))||voices[0]||null;}
function stopSpeech(){speechToken++;if('speechSynthesis'in window)speechSynthesis.cancel();utterance=null;}
function say(text,sequence=null){
 if(!('speechSynthesis'in window)||typeof SpeechSynthesisUtterance==='undefined'){toast('此浏览器不支持英文朗读；可以继续阅读和答题。');return;}
 stopSpeech();refreshVoices();const token=speechToken;let lines=sequence||[text],i=0;
 const play=()=>{if(token!==speechToken||i>=lines.length)return;const u=new SpeechSynthesisUtterance(lines[i++]);utterance=u;const voice=chosenVoice();if(voice)u.voice=voice;u.lang=voice?voice.lang:'en-GB';u.rate=state.settings.rate;u.pitch=1;u.volume=1;u.onend=()=>{if(token===speechToken)setTimeout(play,200);};u.onerror=e=>{if(e.error!=='interrupted'&&e.error!=='canceled'&&token===speechToken)toast('朗读未能播放。请检查系统英文语音，或使用文字模式。');};speechSynthesis.speak(u);};play();
}
function fillVoices(){let sel=$('#voice-select');if(!sel)return;let v=chosenVoice();sel.innerHTML=`<option value="">自动选择英文声音</option>`+voices.map(x=>`<option value="${esc(x.voiceURI)}" ${x.voiceURI===state.settings.voice?'selected':''}>${esc(x.name)} · ${esc(x.lang)}${x.localService?' · 本地':' · 可能需联网'}</option>`).join('');const status=$('#voice-status');if(status)status.textContent=!('speechSynthesis'in window)?'当前浏览器不支持语音朗读。所有文字练习仍可使用。':v?`当前声音：${v.name}。${v.localService?'浏览器标记为本地声音；建议断网试听确认。':'浏览器未标记为本地声音，离线时可能无法播放。'}`:'暂未列出英文声音。可尝试朗读；无声时请在系统安装英文语音，或改用文字练习。';}
if('speechSynthesis'in window){speechSynthesis.addEventListener('voiceschanged',refreshVoices);refreshVoices();}
// Focus timer intentionally does not claim to measure proficiency or save elapsed study time.
let timer={running:false,left:2100,end:0,started:false};
function timerText(){let n=Math.max(0,Math.ceil(timer.left));return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');}
function updateTimer(){if(timer.running){timer.left=Math.max(0,(timer.end-Date.now())/1000);if(timer.left<=0){timer.running=false;toast('35 分钟练习结束。休息一下，再回顾今天卡住的地方。');}}
 document.querySelectorAll('[data-timer-display]').forEach(x=>x.textContent=timerText());document.querySelectorAll('[data-timer-toggle]').forEach(x=>{x.innerHTML=ic(timer.running?'pause':'play');x.setAttribute('aria-label',timer.running?'暂停计时':'开始或继续计时');});$('#floating-timer').classList.toggle('visible',timer.started);}
setInterval(updateTimer,1000);
function toggleTimer(){if(timer.running){timer.left=Math.max(0,(timer.end-Date.now())/1000);timer.running=false;}else{if(timer.left<=0)timer.left=2100;timer.end=Date.now()+timer.left*1000;timer.running=true;timer.started=true;}updateTimer();}
// Stable questions with rotated options. Scores are comprehension checks, not oral assessments.
function rotateOptions(correct,distractors,seed){const rest=[...new Set(distractors.filter(x=>x!==correct))].slice(0,2);while(rest.length<2)rest.push(rest.length?'以上都不是':'没有提供这项信息');const answer=seed%3,options=[...rest];options.splice(answer,0,correct);return {options,answer};}

 const listenDistractors={
 'w1d1':['十五元。','五十一元。'], 'w1d2':['五十元五角。','十五元整。'],

// One delegated listener keeps all navigation and dynamic exercise controls functional.
document.addEventListener('click',event=>{const el=event.target.closest('button,[data-action]');if(!el||el.disabled)return;if(el.dataset.nav){go(el.dataset.nav);return;}if(el.hasAttribute('data-say')){say(el.dataset.say);return;}let a=el.dataset.action,id=el.dataset.id;
 switch(a){
 case'menu':$('#sidebar').classList.add('open');$('#backdrop').classList.add('open');$('.menu-toggle').setAttribute('aria-expanded','true');break;
 case'closemenu':closeMenu();break;
 case'closemodal':closeModal();break;
 case'confirmmodal':{const fn=confirmAction;closeModal();if(fn)fn();break;}
 case'timer':toggleTimer();break;
 case'timerreset':timer={running:false,left:2100,end:0,started:false};updateTimer();break;
 case'stopspeech':stopSpeech();break;
 case'jumpweek':{const w=el.dataset.week;go('plan');setTimeout(()=>$('#week-'+w)?.scrollIntoView({block:'start',behavior:'smooth'}),40);break;}
 case'favorite':{if(!ENTRY_MAP[id])break;let i=state.favorites.indexOf(id);if(i<0)state.favorites.push(id);else state.favorites.splice(i,1);save();render(true);break;}
 case'addlesson':addLessonReview(id);renderNav();break;
 case'addentry':if(addReview(id)){save();toast('已加入复习计划。');if(route.page==='words')updateWordsResults();renderNav();}break;
 case'readlabel':{const l=LESSON_MAP[id],p=l.label;say('',[p.title,p.subtitle,p.price,...p.lines.map(([k,v])=>k+'. '+v),p.foot]);break;}
 case'readanswer':readAnswers[id+':r'+el.dataset.q]=Number(el.dataset.option);render(true);break;
 case'resetreading':delete readAnswers[id+':r0'];delete readAnswers[id+':r1'];render(true);break;
 case'readdialogue':say('',LESSON_MAP[id].dialogue.map(d=>d.en));break;
 case'dialogmode':stopSpeech();dialogMode=el.dataset.mode;render(true);break;
 case'rolereveal':roleState.revealed=true;render(true);break;
 case'roleagain':roleState.revealed=false;render(true);toast('再用自己的话说一次，然后翻开参考。');break;
 case'rolenext':roleState.round++;roleState.revealed=false;if(roleState.round>=LESSON_MAP[roleState.id].dialogue.length/2){roleState.finished=true;state.oral[roleState.id]=localDate();logActivity();}render(true);break;
 case'rolereset':roleState={id:route.id,round:0,revealed:false,finished:false};render(true);break;
 case'startquiz':quiz=newQuiz(el.dataset.mode,id||'');go('quiz/'+el.dataset.mode+'/'+(id||''));break;
 case'quizanswer':{if(!quiz||quiz.finished||quiz.answers[quiz.index]!==undefined)break;const q=quiz.questions[quiz.index],ans=Number(el.dataset.option);quiz.answers[quiz.index]=ans;if(quiz.mode!=='placement'){if(ans===q.answer)delete state.mistakes[q.id];else state.mistakes[q.id]={count:(state.mistakes[q.id]?.count||0)+1,date:localDate()};}logActivity();render(true);break;}
 case'quiznext':if(quiz.answers[quiz.index]===undefined)break;stopSpeech();quiz.index++;if(quiz.index>=quiz.questions.length)finishQuiz();render();break;
 case'revealtranscript':quiz.revealed[quiz.questions[quiz.index].id]=true;render(true);break;
 case'retryquiz':quiz=newQuiz(quiz.mode,quiz.id);render();break;
 case'exitquiz':confirmModal('退出这轮测验？','未完成的本轮成绩不会记为课程完成；已经提交的错题记录会保留。',()=>{const dest=quiz.mode==='lesson'?'lesson/'+quiz.id+'/quiz':quiz.mode==='week'?'plan':quiz.mode==='stage'?'checkpoints/'+quiz.id:quiz.mode==='placement'?'placement':'review';quiz=null;go(dest);});break;
 case'wordfilter':wordFilter=el.dataset.filter;render(true);break;
 case'startreview':startReview(el.dataset.mode);break;
 case'flipreview':if(review){review.revealed=true;render(true);}break;
 case'gradereview':gradeReview(el.dataset.grade);break;
 case'endreview':review=null;render();break;
 case'showphrase':{const x=DATA.rescue[Number(el.dataset.group)].items[Number(el.dataset.index)];modal(`<div class="show-card"><span class="badge">SHOW THIS TO SOMEONE</span><div class="display-en en" lang="en">${esc(x.en)}</div><p>${esc(x.zh)}</p><div class="row" style="justify-content:center">${btn(`${ic('speaker')} 朗读`,`data-say="${esc(x.en)}"`,'secondary')}${btn('关闭','data-action="closemodal"','ghost')}</div></div>`);break;}
 case'print':window.print();break;
 case'export':exportProgress();break;
 case'import':$('#import-file').value='';$('#import-file').click();break;
 case'resetrequest':confirmModal('清除全部学习记录？','这会清除当前浏览器的进度、收藏、错题和复习安排。课程内容不会删除。建议先导出备份。',()=>{state=defaults();quiz=null;review=null;readAnswers={};roleState=null;buildStates={};wordQuery='';wordFilter='all';wordWeek='all';save();go('home');toast('学习记录已清除。');},true);break;
 }
});
document.addEventListener('input',e=>{if(e.target.id==='word-search'){wordQuery=e.target.value;updateWordsResults();}if(e.target.dataset.setting==='rate'){state.settings.rate=Number(e.target.value);$('#rate-value').textContent=state.settings.rate.toFixed(2)+'×';save();}});
document.addEventListener('change',e=>{let t=e.target,k=t.dataset.setting;if(t.id==='word-week'){wordWeek=t.value;updateWordsResults();}if(t.id==='show-translation'){state.settings.showTranslation=t.checked;save();render(true);}if(k==='start'){if(validDate(t.value)){state.start=t.value;save();render(true);}else{t.value=state.start;toast('请选择有效的开始日期。');}}else if(k==='departure'){state.settings.departure=validDate(t.value)?t.value:'';save();toast('出发日期已保存。');}else if(k==='voice'){state.settings.voice=t.value;save();fillVoices();}});
function exportProgress(){const payload={app:'departure-english',version:2,exportedAt:new Date().toISOString(),state};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='complete-english-progress-'+localDate()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('已生成学习记录备份。');}
$('#import-file').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;if(f.size>2*1024*1024){toast('备份文件过大，请选择本网页导出的 JSON 文件。');return;}try{const raw=JSON.parse(await f.text());if(raw.app!=='departure-english'||![1,2].includes(raw.version)||!object(raw.state))throw Error('invalid');const incoming=normalise(raw.state);confirmModal('用备份覆盖当前记录？',`这份备份包含 ${Object.keys(incoming.completed).length} 节已完成课程和 ${Object.keys(incoming.review).length} 张复习卡。导入不会合并现有记录。`,()=>{state=incoming;quiz=null;review=null;roleState=null;readAnswers={};save();render();toast('备份已导入。');});}catch(err){toast('无法读取这份备份。请使用本网页导出的 JSON 文件。');}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu();});
window.addEventListener('hashchange',()=>{stopSpeech();closeMenu();render();});
window.addEventListener('beforeunload',()=>{stopSpeech();save();});

// Complete-path additions. All content is embedded; no analytics or network API.
function defaults(){return {version:2,start:localDate(),completed:{},scores:{},weekly:{},review:{},favorites:[],activity:[],mistakes:{},oral:{},lastLesson:LESSONS[0].id,stages:{},stageSkills:{},notes:{},placement:null,maintenance:{},focusStage:1,settings:{rate:.85,voice:'',departure:'',showTranslation:true}};}
function normalise(raw){
 const s=defaults();if(!object(raw))return s;const legacy=Number(raw.version||1)===1;
 if(validDate(raw.start))s.start=raw.start;
 for(const k of ['completed','oral'])if(object(raw[k]))for(const [id,d] of Object.entries(raw[k]))if(LESSON_MAP[id]&&validDate(d))s[k][id]=d;
 for(const k of ['scores','weekly','stages'])if(object(raw[k]))for(const [rawid,r] of Object.entries(raw[k])){
   const id=k==='weekly'&&legacy?String(DATA.legacyWeeks[rawid]||''):rawid;
   if((k==='scores'?!!LESSON_MAP[id]:k==='weekly'?WEEKS.some(w=>String(w.n)===id):STAGES.some(g=>String(g.id)===id))&&object(r)&&Number.isFinite(r.best))
   s[k][id]={best:bounded(r.best,0,100),last:bounded(r.last,0,100),date:validDate(r.date)?r.date:localDate(),unassistedBest:bounded(r.unassistedBest,0,100),assisted:!!r.assisted};
 }
 if(object(raw.review))for(const [id,r] of Object.entries(raw.review))if(ENTRY_MAP[id]&&object(r)&&validDate(r.due))s.review[id]={level:bounded(r.level,0,5),due:r.due,lapses:bounded(r.lapses,0,1e6),seen:bounded(r.seen,0,1e6)};
 if(Array.isArray(raw.favorites))s.favorites=[...new Set(raw.favorites.filter(id=>typeof id==='string'&&ENTRY_MAP[id]))];
 if(Array.isArray(raw.activity))s.activity=[...new Set(raw.activity.filter(validDate))].sort().slice(-3000);
 if(object(raw.mistakes))for(const [id,r] of Object.entries(raw.mistakes))if((LESSON_MAP[id.split(':')[0]]&&/:(r[01]|word|phrase|listen)$/.test(id)||/^stage[1-6]:q[0-7]$/.test(id))&&object(r))s.mistakes[id]={count:Math.max(1,bounded(r.count,1,1e6)),date:validDate(r.date)?r.date:localDate()};
 if(LESSON_MAP[raw.lastLesson])s.lastLesson=raw.lastLesson;
 s.focusStage=bounded(raw.focusStage||1,1,6);
 if(object(raw.stageSkills))for(const g of STAGES)if(Array.isArray(raw.stageSkills[g.id]))s.stageSkills[g.id]=g.skills.map((_,i)=>raw.stageSkills[g.id][i]===true);
 if(object(raw.notes))for(const [id,note] of Object.entries(raw.notes))if(LESSON_MAP[id]&&typeof note==='string')s.notes[id]=note.slice(0,6000);
 if(object(raw.maintenance))for(const [id,date] of Object.entries(raw.maintenance))if(/^m[1-4]-[1-3]$/.test(id)&&validDate(date))s.maintenance[id]=date;
 if(object(raw.placement)&&Array.isArray(raw.placement.blocks))s.placement={blocks:raw.placement.blocks.slice(0,3).map(n=>bounded(n,0,4)),date:validDate(raw.placement.date)?raw.placement.date:localDate(),recommendation:bounded(raw.placement.recommendation,1,4),score:bounded(raw.placement.score,0,100)};
 if(object(raw.settings)){const t=raw.settings;s.settings.rate=Math.max(.6,Math.min(1.2,Number(t.rate)||.85));s.settings.voice=typeof t.voice==='string'?t.voice.slice(0,400):'';s.settings.departure=validDate(t.departure)?t.departure:'';s.settings.showTranslation=t.showTranslation!==false;}
 return s;
}
function bounded(n,a,b){return Math.max(a,Math.min(b,Math.round(Number(n)||0)));}
function nextLesson(){const focused=state.focusStage||1;const last=LESSON_MAP[state.lastLesson];if(last&&last.stage>=focused&&!state.completed[last.id])return last;return LESSONS.find(l=>l.stage>=focused&&!state.completed[l.id])||LESSONS.find(l=>!state.completed[l.id])||LESSONS[LESSONS.length-1];}
function stagePassed(id){return (state.stages[id]?.unassistedBest||0)>=80&&STAGES[id-1].skills.every((_,i)=>state.stageSkills[id]?.[i]===true);}
function stageCount(){return STAGES.filter(s=>stagePassed(s.id)).length;}
function stageTiles(current=0){return `<div class="stage-grid">${STAGES.map(g=>{const done=LESSONS.filter(l=>l.stage===g.id&&state.completed[l.id]).length;return `<button class="stage-tile ${current===g.id?'current':''}" data-nav="plan/${g.id}"><div class="row between"><span class="eyebrow">STAGE 0${g.id}</span><span class="badge">${stagePassed(g.id)?'验收记录达标':done+' / 20'}</span></div><h3>${esc(g.name)}</h3><p>${esc(g.goal)}</p><small>${g.span}</small><div class="progress"><span style="width:${done*5}%"></span></div></button>`;}).join('')}</div>`;}
function parseRoute(){const p=location.hash.replace(/^#/,'').split('/'),page=p[0]||'home';
 if(page==='lesson'&&LESSON_MAP[p[1]])return {page,id:p[1],tab:['words','reading','dialogue','practice','quiz'].includes(p[2])?p[2]:'words'};
 if(page==='quiz'&&((p[1]==='lesson'&&LESSON_MAP[p[2]])||(p[1]==='week'&&WEEKS.some(w=>String(w.n)===p[2]))||(p[1]==='stage'&&STAGES.some(s=>String(s.id)===p[2]))||['mistakes','placement'].includes(p[1])))return {page,mode:p[1],id:p[2]||''};
 if(['plan','checkpoints'].includes(page))return {page,stage:STAGES.some(s=>String(s.id)===p[1])?Number(p[1]):0};
 if(['home','words','review','rescue','settings','placement','maintain'].includes(page))return {page};return {page:'home'};
}
function renderNav(){let p=route.page==='lesson'?'plan':route.page==='quiz'?(route.mode==='stage'?'checkpoints':route.mode==='placement'?'placement':route.mode==='mistakes'?'review':'plan'):route.page;
 const navs=[['home','home','今日学习'],['plan','map','完整学习路线'],['placement','shield','起点自测'],['checkpoints','check','阶段验收'],['words','book','词句口袋'],['review','repeat','间隔复习'],['maintain','leaf','长期保持'],['rescue','chat','旅行速查卡']];
 $('#nav').innerHTML=navs.map(([id,icon,name])=>`<button data-nav="${id}" class="${p===id?'active':''}" ${p===id?'aria-current="page"':''}>${ic(icon)}<span>${name}</span>${id==='review'&&dueIDs().length?`<span class="nav-count">${dueIDs().length}</span>`:''}</button>`).join('');
 $('.side-settings').classList.toggle('active',p==='settings');$('#crumb').textContent=({home:'今日学习',plan:'完整学习路线',placement:'起点自测',checkpoints:'阶段验收',words:'词句口袋',review:'间隔复习',maintain:'长期保持',rescue:'旅行速查卡',settings:'设置与备份',lesson:'场景课程',quiz:'理解练习'})[route.page];
}
function render(keepScroll=false){const y=window.scrollY;route=parseRoute();renderNav();let html='';switch(route.page){case'home':html=homePage();break;case'plan':html=planPage();break;case'lesson':html=lessonPage();break;case'quiz':html=quizPage();break;case'words':html=wordsPage();break;case'review':html=reviewPage();break;case'rescue':html=rescuePage();break;case'settings':html=settingsPage();break;case'placement':html=placementPage();break;case'checkpoints':html=checkpointsPage();break;case'maintain':html=maintainPage();break;}
 $('#main').innerHTML=html;storageWarning();if(route.page==='settings')fillVoices();updateTimer();if(keepScroll)window.scrollTo(0,y);else{window.scrollTo(0,0);$('#main').focus({preventScroll:true});}lastRoute=location.hash;
}
function homePage(){const l=nextLesson(),done=learned(),pct=Math.round(done/LESSONS.length*100),due=dueIDs().length,g=STAGES[l.stage-1],oral=Object.keys(state.oral).length;
 return pageTop('从会认，到自己办成事情。','完整路径 · 基础 → 场景 → 独立交流。不是再背一套旅行用语。',`<span class="badge warm">120 节课 · 24 周参考节奏</span>`)+`
 <div class="home-grid"><section class="hero"><div class="eyebrow">EVERYDAY ENGLISH · COMPLETE PATH</div><h2>第 ${String(l.number).padStart(3,'0')} 课 · ${esc(l.title)}<br>把今天的一个技能，真正用起来。</h2><p>${esc(l.goal)}</p><div class="hero-bottom">${btn(`继续学习 ${ic('arrow')}`,`data-nav="lesson/${l.id}/words"`,'light')}${btn('先测测起点','data-nav="placement"','hero-outline')}</div><div class="hero-meta"><span>${ic('clock')} 每课约 30–40 分钟</span><span>阶段 ${l.stage} / 6</span><span>第 ${l.week} 周</span></div></section>
 <section class="card trip-card"><div class="row between"><h3>完整路径进度</h3><span class="badge">6 STAGES</span></div><div class="trip-main"><div class="progress-ring" style="--pct:${pct}%"><div class="ring-inner"><strong>${pct}%</strong><span>理解练习过关</span></div></div><div class="trip-details"><strong>${done} / 120 节课</strong><small>${oral} 节开口自评已记录</small><small>${stageCount()} / 6 阶段验收记录达标</small></div></div><div class="note">${esc(g.name)}<br><small>学习日期只是参考。能力未稳就复练，已有基础可以定位后跳读；不自动把跳过的课记为完成。</small></div></section></div>
 <div class="stat-grid"><div class="card stat-card"><div class="stat-icon">${ic('book')}</div><div><div class="stat-value">${done}<small>/ 120 节</small></div><div class="stat-caption">理解小测达到 80%</div></div></div><div class="card stat-card"><div class="stat-icon">${ic('repeat')}</div><div><div class="stat-value">${due}<small>张</small></div><div class="stat-caption">今天到期复习</div></div></div><div class="card stat-card"><div class="stat-icon">${ic('flame')}</div><div><div class="stat-value">${streak()}<small>天</small></div><div class="stat-caption">连续练习记录</div></div></div></div>
 <div class="section-head"><h2>先回忆，再学新，最后自己说</h2><span class="muted">每天可拆成两次练习</span></div><div class="steps-grid"><article class="card step-card"><span class="badge">01 · 5 分钟</span><h3>复习到期词句</h3><p>先看中文回忆英文，不因眼熟就判定掌握。</p><button class="text-link" data-nav="review">开始复习 ${ic('arrow')}</button></article><article class="card step-card"><span class="badge">02 · 15 分钟</span><h3>理解新材料</h3><p>学词句、读信息、听对话，注意否定与条件。</p><button class="text-link" data-nav="lesson/${l.id}/reading">阅读本课 ${ic('arrow')}</button></article><article class="card step-card"><span class="badge">03 · 15 分钟</span><h3>开口、组句与检验</h3><p>遮住答案接话，写自己的句子，再做理解小测。</p><button class="text-link" data-nav="lesson/${l.id}/practice">自己组句 ${ic('arrow')}</button></article></div>

function weekBlock(w){const ls=LESSONS.filter(l=>l.week===w.n),done=ls.filter(l=>state.completed[l.id]).length,day=(w.n-1)*7,score=state.weekly[w.n];return `<section class="week-panel card" id="week-${w.n}"><div class="week-heading"><div class="week-number">${String(w.n).padStart(2,'0')}</div><div style="flex:1"><div class="eyebrow">WEEK ${String(w.n).padStart(2,'0')} · 阶段 ${w.stage}</div><h2>${esc(w.name)}</h2><p>${esc(w.goal)}</p></div><span class="badge">${done}/5</span></div><div class="week-days">${ls.map(l=>`<button class="day-card ${state.completed[l.id]?'done':''}" data-nav="lesson/${l.id}/words"><span class="day-n">LESSON ${String(l.number).padStart(3,'0')}<span>${state.completed[l.id]?ic('check'):shortDate(addDays(state.start,day+l.day-1))}</span></span><strong>${esc(l.title)}</strong><small>${state.oral[l.id]?'开口自评已记 · ':''}${state.completed[l.id]?'理解过关，可复练':'词句 · 阅读 · 对话 · 组句'}</small></button>`).join('')}<button class="day-card test ${score?.best>=80?'done':''}" data-nav="quiz/week/${w.n}"><span class="day-n">第 6 天<span>${shortDate(addDays(state.start,day+5))}</span></span><strong>周复习与小测</strong><small>${score?'最好成绩 '+score.best+'%':'10 题 · 已学材料重练'}</small></button><div class="day-card rest"><span class="day-n">第 7 天</span><strong>休息 / 补漏</strong><small>换一组条件再开口</small></div></div></section>`;}
function planPage(){const selected=route.stage||0;return pageTop('不是一个冲刺阶段，而是从头到尾。','每阶段 20 节实课、4 次周测、1 次陌生材料验收。建议每周 5 天新课、1 天复习、1 天休息。',btn('测起点 / 跳级','data-nav="placement"','secondary'))+`

 <div class="card" style="padding:16px 20px;margin-bottom:24px"><div class="date-row"><label for="plan-start">计划起始日期</label><input id="plan-start" type="date" value="${state.start}" data-setting="start"><span>24 周参考日程；可延长复练，所有课均不锁定。</span></div></div>
 ${STAGES.filter(s=>!selected||s.id===selected).map(g=>`<section class="stage-section" id="stage-${g.id}"><div class="stage-banner"><div><div class="eyebrow">STAGE 0${g.id} · ${esc(g.en)}</div><h2>${esc(g.name)}</h2><p>${esc(g.span)} · ${esc(g.goal)}</p></div><div class="row wrap">${btn('从这里继续',`data-action="focusstage" data-stage="${g.id}"`,'secondary')}${btn('阶段验收',`data-nav="checkpoints/${g.id}"`,'ghost')}</div></div>${WEEKS.filter(w=>w.stage===g.id).map(weekBlock).join('')}<div class="note" style="margin-bottom:30px">出口任务：${esc(g.skills.join(' '))}</div></section>`).join('')}

function lessonPage(){const l=LESSON_MAP[route.id],tab=route.tab;state.lastLesson=l.id;save();if(tab==='quiz')return lessonQuizIntro(l);
 const tabs=[['words','01 词句与基础'],['reading','02 看懂信息'],['dialogue','03 听说对话'],['practice','04 组句与表达'],['quiz','05 理解小测']];

 let body=tab==='words'?lessonWords(l)+grammarCard(l):tab==='reading'?lessonReading(l):tab==='dialogue'?lessonDialogue(l):practicePage(l);
 return head+`<div class="lesson-layout"><section class="lesson-content">${body}</section><aside class="card lesson-aside"><div class="eyebrow muted">TODAY’S OUTCOME</div><h3 style="margin-top:8px">独立完成这个任务</h3><p>${esc(l.task)}</p><div class="divider"></div><p>${esc(l.tip)}</p><div class="divider"></div><h3>给自己 35 分钟</h3><div class="timer-mini"><strong data-timer-display>${timerText()}</strong><button class="icon-btn" data-action="timer" data-timer-toggle aria-label="开始计时">${ic('play')}</button></div><div class="timer-note">计时只是提醒，不用于判断能力。</div><div class="divider"></div><p>每课小测只检查理解。口语不自动评分；请先开口，再诚实自评。后期课程先独立做任务，再看参考。</p>${btn('阶段出口要求',`data-nav="checkpoints/${l.stage}"`,'ghost small')}</aside></div>`;

function grammarCard(l){const g=WEEKS[l.week-1].grammar;return `<section class="card grammar-card"><div class="eyebrow muted">THIS WEEK’S LANGUAGE TOOL</div><h3>${esc(g.title)}</h3><p>${esc(g.explain)}</p><div class="pattern en" lang="en">${esc(g.form)}</div>${g.examples.map(x=>`<div class="row between grammar-example"><div><div lang="en" class="en">${esc(x.en)}</div><small class="muted">${esc(x.zh)}</small></div>${speakBtn(x.en)}</div>`).join('')}${l.stage===1?foundationTools(l):''}</section>`;}
function foundationTools(l){let tools='';if(l.week===1){const nums=[['0','zero'],['1','one'],['2','two'],['3','three'],['4','four'],['5','five'],['6','six'],['7','seven'],['8','eight'],['9','nine'],['10','ten'],['11','eleven'],['12','twelve'],['13','thirteen'],['14','fourteen'],['15','fifteen'],['16','sixteen'],['17','seventeen'],['18','eighteen'],['19','nineteen'],['20','twenty'],['30','thirty'],['40','forty'],['50','fifty'],['60','sixty'],['70','seventy'],['80','eighty'],['90','ninety'],['100','one hundred']];
 tools+=`<details class="learning-details"><summary>字母、数字与听音工具</summary><p class="muted">点击字母听字母名称，不是该字母在所有单词里的读音。朗读由设备提供，声音可能因系统不同而变化。</p><div class="alphabet-grid">${'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(x=>`<button class="pill" data-say="${x}" aria-label="读字母 ${x}">${x}<small>${x.toLowerCase()}</small></button>`).join('')}</div><div class="number-grid">${nums.map(([n,en])=>`<button class="number-chip" data-say="${en}"><b>${n}</b><span>${en}</span></button>`).join('')}</div><p class="muted">听词对并跟读：不要只看拼写。先听不同，再读清词尾。这里用系统单词朗读，不是自动发音诊断。</p><div class="pair-grid">${[['thirteen','thirty'],['fifteen','fifty'],['ship','sheep'],['sit','seat'],['bag','back'],['rice','rise']].map(pair=>`<div class="sound-pair">${pair.map(w=>btn(esc(w),`data-say="${w}"`,'ghost small')).join('')}</div>`).join('')}</div></details>`;
 }else if(l.week===2){tools+=`<details class="learning-details"><summary>星期与月份速听</summary><div class="number-grid">${['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday','January','February','March','April','May','June','July','August','September','October','November','December'].map(w=>btn(w,`data-say="${w}"`,'ghost small')).join('')}</div></details>`;}
 return tools;
}
function lessonDialogue(l){if(!roleState||roleState.id!==l.id)roleState={id:l.id,round:0,revealed:false,finished:false};const total=l.dialogue.length/2,mode=dialogMode;
 const top=`<div class="row between wrap"><h2>听懂追问，再接一句。</h2><div class="row"><button class="pill ${mode==='read'?'active':''}" data-action="dialogmode" data-mode="read">看对话</button><button class="pill ${mode==='role'?'active':''}" data-action="dialogmode" data-mode="role">轮到你说</button></div></div>`;
 if(mode==='read')return top+`${l.stage>=5?`<div class="note warm" style="margin-top:16px">先试任务：${esc(l.task)}<br>下方是一个参考版本，不是唯一正确说法。完成独立尝试后再阅读更有检验价值。</div>`:''}<div class="row between wrap" style="margin-top:17px"><label class="checkbox-label"><input type="checkbox" id="show-translation" ${state.settings.showTranslation?'checked':''}>显示中文</label><div class="row">${btn(`${ic('speaker')} 朗读整段`,`data-action="readdialogue" data-id="${l.id}"`,'secondary small')}${btn('停止','data-action="stopspeech"','ghost small')}</div></div><div class="dialogue">${l.dialogue.map(d=>`<div class="bubble-wrap ${d.role==='you'?'you':''}"><div class="avatar">${d.role==='you'?'你':'对方'}</div><div class="bubble"><div class="en" lang="en">${esc(d.en)}</div>${state.settings.showTranslation?`<div class="zh">${esc(d.zh)}</div>`:''}<div class="bubble-controls"><span style="font-size:10px;color:#718078">${d.role==='you'?'YOUR TURN':'LISTEN'}</span>${speakBtn(d.en)}</div></div></div>`).join('')}</div><div class="lesson-actions">${btn('遮住我的答案，练接话','data-action="dialogmode" data-mode="role"','secondary')}${btn('自己组句与表达',`data-nav="lesson/${l.id}/practice"`)}</div>`;
 if(roleState.finished)return top+`<div class="card quiz-result" style="margin-top:20px"><div class="score-circle"><strong>${total}</strong><small>轮问答自评已记录</small></div><h2>练过，不等于已经自动掌握。</h2><p>这不是自动语音评分。现在换一个人数、时间或商品，再做一遍；请同伴加一个没准备过的追问。</p><div class="result-actions">${btn('再练一次','data-action="rolereset"','secondary')}${btn('继续组句与表达',`data-nav="lesson/${l.id}/practice"`)}</div></div>`;
 const d=l.dialogue[roleState.round*2],a=l.dialogue[roleState.round*2+1];return top+`<div class="role-box"><div class="row between"><span class="badge">第 ${roleState.round+1} / ${total} 轮</span>${speakBtn(d.en)}</div><div class="role-prompt en" lang="en">${esc(d.en)}</div>${state.settings.showTranslation?`<p class="muted">${esc(d.zh)}</p>`:''}<div class="divider"></div><p>你要表达：<strong>${esc(a.zh)}</strong></p><p class="muted" style="font-size:12px;margin:12px 0">先说出口再看参考。不使用麦克风、不提供语音识别或发音评分。意思清楚即可，不必完全逐字一致。</p>${roleState.revealed?`<div class="role-answer"><div class="row between"><div class="en" lang="en">${esc(a.en)}</div>${speakBtn(a.en)}</div></div><div class="row wrap">${btn('再遮住练一次','data-action="roleagain"','ghost')}${btn('我说出来了，下一轮','data-action="rolenext"')}</div>`:btn('我先说过了，看看参考','data-action="rolereveal"','secondary')}</div>`;
}
let buildStates={};
function getBuild(l){if(!buildStates[l.id]){const target=l.phrases[0].en.split(/\s+/);const pool=target.map((x,i)=>({text:x,original:i}));for(let i=pool.length-1;i>0;i--){let j=(l.number*7+i*3)%(i+1);[pool[i],pool[j]]=[pool[j],pool[i]];}if(pool.map(x=>x.text).join(' ')===target.join(' ')&&pool.length>1)pool.push(pool.shift());buildStates[l.id]={pool,chosen:[],feedback:'',ok:false,reference:false};}return buildStates[l.id];}
function normalizeSentence(t){return String(t).normalize('NFKC').replace(/[‘’]/g,"'").toLowerCase().replace(/[.,!?;:。？！]/g,'').replace(/\s+/g,' ').trim();}
function practicePage(l){const b=getBuild(l);return `<h2>这次，由你来组织表达。</h2><p class="muted" style="margin:10px 0 20px">一项有明确答案的组句练习，加一项开放表达。写作保存在本浏览器，可随记录导出。</p><section class="card"><div class="row between"><h3>① 按顺序点词，拼出参考句</h3><span class="badge">可自动核对语序</span></div><p style="margin:14px 0">${esc(l.phrases[0].zh)}</p><div class="sentence-slot en" lang="en" aria-live="polite">${b.chosen.length?b.chosen.map(i=>esc(b.pool[i].text)).join(' '):'<span class="muted">从下面选词，组成英文句子。</span>'}</div><div class="word-tiles">${b.pool.map((x,i)=>`<button class="pill" data-action="buildword" data-id="${l.id}" data-index="${i}" ${b.chosen.includes(i)?'disabled':''}>${esc(x.text)}</button>`).join('')}</div><div class="row wrap" style="margin-top:15px">${btn('核对语序',`data-action="checkbuild" data-id="${l.id}"`)}${btn('撤回一个',`data-action="undobuild" data-id="${l.id}"`,'ghost')}${btn('重新拼',`data-action="resetbuild" data-id="${l.id}"`,'ghost')}${btn('看参考',`data-action="showbuild" data-id="${l.id}"`,'secondary')}</div>${b.feedback?`<div class="note ${b.ok?'':'warm'}" style="margin-top:15px">${esc(b.feedback)}</div>`:''}${b.reference?`<div class="row between pattern"><span class="en" lang="en">${esc(l.phrases[0].en)}</span>${speakBtn(l.phrases[0].en)}</div>`:''}</section>
 <section class="card writing-card"><div class="row between wrap"><h3>② 换成自己的信息，开口或写下来</h3><span class="badge warm">开放任务 · 自评</span></div><p>${esc(l.task)}</p><p class="muted">${l.stage<=2?'写 1–3 句也可以。先表达清楚，不用追求长句。':l.stage<=4?'写 3–5 句；先独立完成，再对照本课用法。':'写 6–8 句或用约一分钟说明，最后总结决定与下一步。'} 不要输入真实证件、密码或银行信息。</p><label for="lesson-note">我的表达 / 今天卡住的地方</label><textarea id="lesson-note" data-note="${l.id}" maxlength="6000" rows="7" placeholder="先自己说或写。这里不会假装自动判断语义或发音。">${esc(state.notes[l.id]||'')}</textarea><div class="row between wrap"><small class="muted" id="note-status">${state.notes[l.id]?'已保存本地草稿':'输入后自动保存；刷新仍可继续。'}</small>${btn('保存草稿',`data-action="savenote" data-id="${l.id}"`,'secondary')}</div><details class="learning-details"><summary>做完后，再看参考与自评标准</summary><div class="note">参考是本课的一种表达，不是唯一答案；网页没有 AI 语义评分。自查：是否满足任务？数字和否定是否准确？对方能否知道下一步？</div>${l.dialogue.filter(x=>x.role==='you').map(x=>`<p class="en" lang="en">${esc(x.en)}</p>`).join('')}</details></section><div class="lesson-actions">${btn('回到听说',`data-nav="lesson/${l.id}/dialogue"`,'ghost')}${btn('完成理解小测',`data-nav="lesson/${l.id}/quiz"`)}</div>`;}
function placementPage(){return pageTop('先找起点，不必从头硬熬。','12 道阅读诊断题，分为基础、短信息、条件与长句三个区块。不是标准化语言等级测评。')+`<div class="two-column"><section class="card"><span class="eyebrow muted">START WHERE YOU ARE</span><h2 style="margin-top:12px">先看你已经能理解什么。</h2><p style="margin:16px 0">不查词、不看翻译做一遍。自测只帮助定位阅读起点，不能证明听力或口语水平。即使阅读好，听说困难也应从更早阶段补练。</p><div class="note">建议规则：基础区未达 3/4 → 阶段 1；短信息区未达 3/4 → 阶段 2；较长条件区未达 3/4 → 阶段 3；三个区均达到 3/4 → 建议从阶段 4 核验。不会把跳过的课记为已完成。</div><div class="result-actions">${btn('开始 12 题自测','data-action="startquiz" data-mode="placement" data-id="entry"')}${btn('我是初学者，直接开始',`data-action="focusstage" data-stage="1"`,'secondary')}</div></section><section class="card"><h3>上次自测</h3>${state.placement?`<div class="placement-stats">${['基础','短信息','条件长句'].map((t,i)=>`<div><strong>${state.placement.blocks[i]} / 4</strong><span>${t}</span></div>`).join('')}</div><p>记录日期 ${esc(state.placement.date)}；阅读建议起点：阶段 ${state.placement.recommendation}。</p>${btn('从建议阶段继续',`data-action="focusstage" data-stage="${state.placement.recommendation}"`,'secondary')}`:'<p class="muted" style="margin:16px 0">还没有自测记录。所有课程依然可直接访问。</p>'}<div class="divider"></div><h3>再检查听说</h3><p style="margin:12px 0">能否不看英文完成三轮购物？能否听出数字更正？能否用自己的句子说昨天和明天？做不到就先补对应阶段，不要单靠选择题跳级。</p>${btn('查看六个阶段出口','data-nav="checkpoints"','ghost')}</section></div>`;}
function checkpointsPage(){const chosen=route.stage||0;return pageTop('每一阶段，都要检验能不能用。','每次 8 道陌生材料题：4 道阅读、4 道听句；另外完成 3 项开口 / 表达自评。',btn('返回学习路线','data-nav="plan"','ghost'))+`<div class="note warm" style="margin-bottom:20px">“验收记录达标”需要：本阶段测验至少 80%，该次未展开听句文字，并勾选全部独立任务。这里的勾选是自我报告，不是自动口语评分或 CEFR 证书。听不到时可展开英文练习，但不记作未展开文字的成绩。复测会用同一套材料，不能用刷熟代替迁移。</div><div class="pillbar">${[['0','全部'],...STAGES.map(g=>[String(g.id),'阶段 '+g.id])].map(([i,t])=>`<button class="pill ${chosen==i?'active':''}" data-nav="checkpoints${i==='0'?'':'/'+i}">${t}</button>`).join('')}</div>${STAGES.filter(g=>!chosen||g.id===chosen).map(g=>{const sc=state.stages[g.id];return `<section class="card checkpoint-card"><div class="row between wrap"><div><div class="eyebrow">STAGE 0${g.id}</div><h2>${esc(g.name)}</h2></div><span class="badge ${stagePassed(g.id)?'':'warm'}">${stagePassed(g.id)?'验收记录达标':'继续检验与补练'}</span></div><p class="muted" style="margin:12px 0">${esc(g.goal)}</p><div class="gate-stats"><span>最好理解成绩 <b>${sc?sc.best+'%':'—'}</b></span><span>未展开文字的最好成绩 <b>${sc?.unassistedBest?sc.unassistedBest+'%':'—'}</b></span><span>独立任务自评 <b>${(state.stageSkills[g.id]||[]).filter(Boolean).length}/3</b></span></div><div class="skill-checks">${g.skills.map((skill,i)=>`<label><input type="checkbox" data-skill-stage="${g.id}" data-skill-index="${i}" ${state.stageSkills[g.id]?.[i]?'checked':''}><span>${esc(skill)}</span></label>`).join('')}</div><div class="row wrap">${btn('开始陌生材料验收',`data-action="startquiz" data-mode="stage" data-id="${g.id}"`)}${btn('回本阶段补练',`data-nav="plan/${g.id}"`,'secondary')}${g.id<6?btn('查看下一阶段',`data-nav="plan/${g.id+1}"`,'ghost'):btn('进入长期保持','data-nav="maintain"','ghost')}</div></section>`;}).join('')}`;}
function newQuiz(mode,id){let qs=[];if(mode==='lesson')qs=questionsFor(LESSON_MAP[id]);else if(mode==='week'){const ls=LESSONS.filter(l=>l.week===Number(id));qs=[...ls.map(l=>QUESTION_MAP[l.id+':r0']),...ls.map(l=>QUESTION_MAP[l.id+':listen'])];}else if(mode==='stage')qs=STAGES[Number(id)-1].exam.questions;else if(mode==='placement')qs=DATA.placement;else qs=Object.keys(state.mistakes).filter(k=>QUESTION_MAP[k]).map(k=>QUESTION_MAP[k]);return {key:mode+'/'+id,mode,id,questions:qs,index:0,answers:[],revealed:{},finished:false,saved:false};}
function materialHTML(text){return `<article class="card assessment-material"><div class="row between"><span class="badge">原创模拟 · 请只按题面作答</span></div><div class="en" lang="en">${esc(text).replace(/\n/g,'<br>')}</div></article>`;}
function quizPage(){const key=route.mode+'/'+route.id;if(!quiz||quiz.key!==key)quiz=newQuiz(route.mode,route.id);if(!quiz.questions.length)return pageTop('暂时没有待练题目。','答错的题会进入复习；再次答对后移出。')+`<div class="card empty">${btn('回到复习页','data-nav="review"')}</div>`;
 if(quiz.finished)return quizResults();const q=quiz.questions[quiz.index],answered=quiz.answers[quiz.index]!==undefined,a=quiz.answers[quiz.index],l=LESSON_MAP[q.lesson];
